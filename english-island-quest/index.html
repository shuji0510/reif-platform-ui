<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語アイランドクエスト</title>
<meta name="description" content="中学1年英語 Unit 0〜5 の文法と単語を、島めぐりのボス戦・ならべかえ・リスニングで学ぶ無料のブラウザゲーム。">
<meta name="theme-color" content="#1D5F8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語クエスト">
<meta property="og:type" content="website">
<meta property="og:title" content="英語アイランドクエスト">
<meta property="og:description" content="中学1年英語 Unit 0〜5 を島めぐりゲームで。ボス戦・ならべかえ・リスニングで、遊びながら文法と単語が身につく。">
<meta property="og:image" content="https://shuji0510.github.io/reif-platform-ui/english-island-quest/og.png">
<meta property="og:url" content="https://shuji0510.github.io/reif-platform-ui/english-island-quest/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: 海図のような縦長マップに Unit の島を航路でつなぐ。問題画面は1枚のカードと、下からせり上がる判定シート。英文は4線の上に書く */
:root{
  --sea:#E6F2F1; --paper:#FFFFFF; --paper-2:#F3F8F8; --ink:#15314A; --ink-soft:#52697C; --line:#C9DEDF;
  --deep:#1D5F8F; --deep-ink:#FFFFFF; --accent:#F2A900; --accent-soft:#FFF0C4; --accent-ink:#5A3D00;
  --ok:#1F8556; --ok-soft:#DCF2E6; --ng:#D44533; --ng-soft:#FBE2DD;
  --rule:#A9C2CE; --rule-soft:#CFDDE4; --rule-base:#E0705F; --night:#15314A; --night-ink:#FFFFFF; --night-track:#3A5670;
  --u0:#3C9A6C; --u1:#2C8A57; --u2:#4E9636; --u3:#25877A; --u4:#5E962A; --u5:#5060B9; --sa:#D9742A;
  --on-c:#FFFFFF;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"Andika","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0C1B27; --paper:#13283A; --paper-2:#183247; --ink:#E3EEF2; --ink-soft:#9AB2C1; --line:#24445C;
    --deep:#4FA3DA; --deep-ink:#08202F; --accent:#F6BA2E; --accent-soft:#3A2F12; --accent-ink:#FFE7A6;
    --ok:#46C487; --ok-soft:#123A2A; --ng:#FF7A66; --ng-soft:#41201C;
    --rule:#36566C; --rule-soft:#29465A; --rule-base:#B65A4C; --night:#06131D; --night-ink:#E3EEF2; --night-track:#22394B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0C1B27; --paper:#13283A; --paper-2:#183247; --ink:#E3EEF2; --ink-soft:#9AB2C1; --line:#24445C;
  --deep:#4FA3DA; --deep-ink:#08202F; --accent:#F6BA2E; --accent-soft:#3A2F12; --accent-ink:#FFE7A6;
  --ok:#46C487; --ok-soft:#123A2A; --ng:#FF7A66; --ng-soft:#41201C;
  --rule:#36566C; --rule-soft:#29465A; --rule-base:#B65A4C; --night:#06131D; --night-ink:#E3EEF2; --night-track:#22394B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);background-size:22px 22px}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--f-en);letter-spacing:.01em}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--deep);color:var(--deep-ink);border-color:var(--deep);box-shadow:0 3px 0 var(--ink)}
.btn.gold{background:var(--accent);color:#3A2800;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:6px 2px;font-weight:700;color:var(--deep)}
.say{border:2px solid var(--line);background:var(--paper);border-radius:999px;width:36px;height:36px;flex:none;display:inline-grid;place-items:center;font-size:16px;padding:0}
.say:hover{border-color:var(--deep)}

/* home header */
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-block:8px 16px}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.15;color:var(--ink)}
.brand h1 span{color:var(--deep)}
.player{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:8px 12px;min-width:0}
.lv{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#3A2800;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;line-height:1;border:2px solid var(--ink);flex:none}
.lv small{display:block;font-size:9px;font-family:var(--f-body);font-weight:800}
.pinfo{min-width:0}
.pinfo b{display:block;font-size:14px}
.xpbar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;width:120px;max-width:100%;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--accent)}
.pinfo small{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.qbtn{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:10px 6px;font-weight:800;font-size:13px;display:grid;gap:2px;justify-items:center;text-align:center}
.qbtn:hover{border-color:var(--ink)}
.qbtn .ic{font-size:22px;line-height:1}
.qbtn small{font-weight:700;color:var(--ink-soft);font-size:11px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.quick{grid-template-columns:repeat(2,1fr)}.qbtn{grid-template-columns:auto 1fr;justify-items:start;text-align:left;column-gap:10px;padding:10px 12px}.qbtn .ic{grid-row:span 2;align-self:center}}
@media (max-width:420px){.top{grid-template-columns:1fr}.player{justify-self:start}}

.quick5{grid-template-columns:repeat(5,1fr)}
@media (max-width:520px){.quick.quick5{grid-template-columns:repeat(2,1fr)}.quick5 .qbtn:last-child{grid-column:1/-1}}
.share{grid-template-columns:auto 1fr;align-items:start}
@media (max-width:520px){.share{grid-template-columns:1fr}}
.qr{background:#FFFFFF;padding:10px;border-radius:12px;border:2px solid var(--ink);width:max-content;max-width:100%;justify-self:center}
.qr svg{display:block;width:160px;height:160px}
.urlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.urlrow input{flex:1 1 200px;min-width:0;font-family:var(--f-en);font-size:15px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper-2);color:var(--ink)}
.howto{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.7}
.howto b{color:var(--ink)}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-block:8px;display:grid;gap:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:52px;height:30px;border-radius:99px;border:2px solid var(--ink);background:var(--paper-2);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-soft);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:25px;background:var(--paper)}

/* sea map */
.map{position:relative;display:grid;gap:14px;padding-block:12px 8px}
.map::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--rule);transform:translateX(-50%)}
.stage{position:relative;justify-self:center;background:var(--sea);padding:2px 12px;font-family:var(--f-display);font-size:14px;color:var(--ink-soft);letter-spacing:.06em}
.isle{position:relative;width:min(88%,460px);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.isle:hover{transform:translateY(-2px)}
.isle:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.isle.r{justify-self:end}
.disc{width:64px;height:64px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-content:center;text-align:center;line-height:1;border:2px solid var(--ink)}
.disc small{font-size:10px;font-weight:800;letter-spacing:.08em}
.disc b{font-family:var(--f-display);font-weight:400;font-size:30px}
.isle-t{min-width:0;display:grid;gap:2px}
.isle-t .en{font-weight:700;font-size:18px;line-height:1.2}
.isle-t .jp{font-size:12px;color:var(--ink-soft)}
.stars{color:var(--accent);font-size:15px;letter-spacing:2px}
.stars .off{color:var(--line)}
.isle .mon-s{font-size:30px}
.isle.sa .disc{border-radius:16px;background:var(--sa)}

.foot{font-size:12px;color:var(--ink-soft);margin-top:24px;line-height:1.7}

/* unit page */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hero{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:0 4px 0 var(--ink)}
.hero h2{font-family:var(--f-en);font-weight:700;font-size:clamp(22px,5vw,30px);line-height:1.15}
.hero p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.goal{grid-column:1/-1;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.sec-h{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--ink-soft);margin:22px 0 8px}
.keys{display:grid;gap:8px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ex .en{font-size:18px;font-weight:700;line-height:1.35}
.ex .jp{font-size:13px;color:var(--ink-soft)}
.ex>div{min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:440px){.modes{grid-template-columns:1fr}}
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:12px;box-shadow:0 3px 0 var(--ink)}
.mode:active{transform:translateY(3px);box-shadow:none}
.mode .step{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-family:var(--f-display);font-size:15px}
.mode b{display:block;font-size:15px}
.mode small{font-size:12px;color:var(--ink-soft)}
.mode .st{font-size:12px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.mode.boss{grid-column:1/-1;background:var(--night);color:var(--night-ink);border-color:var(--ink)}
.mode.boss small{color:var(--night-ink);opacity:.75}
.mode.boss .mon-s{font-size:30px}

/* lesson */
.lesson{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:20px;display:grid;gap:14px;box-shadow:0 4px 0 var(--ink)}
.lesson h3{font-size:22px;font-weight:800;line-height:1.35}
.lesson p{margin:0;max-width:62ch}
.tip{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.tip b{display:block;font-size:12px;letter-spacing:.08em}
.board{display:flex;flex-wrap:wrap;gap:6px}
.cell{border:2px solid var(--ink);border-radius:10px;overflow:hidden;text-align:center;min-width:64px;background:var(--paper)}
.cell small{display:block;background:var(--c, var(--deep));color:var(--on-c);font-size:11px;font-weight:800;padding:2px 6px}
.cell span{display:block;padding:6px 10px;font-family:var(--f-en);font-weight:700;font-size:18px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink-soft)}
.tbl td.en{font-weight:700;font-size:16px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:20px;border-radius:99px}
.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* quiz */
.qtop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.x{border:2px solid var(--line);background:var(--paper);border-radius:999px;height:36px;padding:0 12px;font-weight:800;font-size:14px}
.prog{height:14px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.hearts{font-size:20px;letter-spacing:2px;color:var(--ng)}
.hearts .off{color:var(--line)}
.timer{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.timer.low{color:var(--ng)}
.combo{justify-self:center;font-family:var(--f-display);font-size:14px;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:2px 12px;margin-bottom:8px;display:inline-block}
.bossbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--night);color:var(--night-ink);border:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.mon{font-size:56px;line-height:1;display:inline-block}
.mon.hit{animation:hit .45s}
.mon.atk{animation:atk .45s}
@keyframes hit{0%{transform:none;filter:none}20%{transform:translateX(-8px) rotate(-8deg);filter:brightness(2)}50%{transform:translateX(8px) rotate(6deg)}100%{transform:none;filter:none}}
@keyframes atk{0%{transform:none}40%{transform:scale(1.35) translateY(6px)}100%{transform:none}}
.bossbox b{font-size:15px}
.hp{height:12px;border-radius:99px;background:var(--night-track);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--ng);transition:width .4s}
.bossbox small{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.dmg{position:absolute;left:44px;top:6px;font-family:var(--f-display);font-size:22px;color:var(--accent);animation:float .8s forwards;pointer-events:none}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.qcard{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:18px;display:grid;gap:14px;box-shadow:0 4px 0 var(--ink)}
.tag{justify-self:start;font-size:12px;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft)}
.prompt{font-size:22px;font-weight:800;line-height:1.45}
.prompt.en{font-size:26px;font-weight:700}
.prompt.big{font-size:40px;text-align:center}
.sub{font-size:14px;color:var(--ink-soft);margin-top:-6px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--deep);margin-inline:4px;height:1em;vertical-align:-2px}
.listen{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bigsay{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:var(--deep);color:var(--deep-ink);font-size:34px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.bigsay.slow{background:var(--paper);color:var(--ink);font-size:26px;width:64px;height:64px;align-self:center}
.reveal{text-align:center;font-size:20px;font-weight:700;min-height:1.6em}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:center;min-height:54px}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--ink-soft);font-family:var(--f-body)}
.opt .t{min-width:0}
.opt.en .t{font-family:var(--f-en);font-size:19px}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.is-ng{background:var(--ng-soft);border-color:var(--ng);box-shadow:0 3px 0 var(--ng)}
.opt:disabled{cursor:default}

/* four-line paper for ordering */
.lines{min-height:64px;padding:0 6px;display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:2px;border-radius:10px;background-color:var(--paper-2);
  background-image:linear-gradient(to bottom,transparent 21px,var(--rule) 21px 22px,transparent 22px 33px,var(--rule-soft) 33px 34px,transparent 34px 45px,var(--rule-base) 45px 47px,transparent 47px 56px,var(--rule) 56px 57px,transparent 57px);
  background-size:100% 64px;background-repeat:repeat-y}
.lines .w{font-family:var(--f-en);font-size:26px;line-height:64px;height:64px;background:none;border:0;padding:0 4px;font-weight:400;border-radius:6px}
.lines .w:hover{background:var(--ng-soft)}
.lines .pt{font-family:var(--f-en);font-size:26px;line-height:64px;margin-left:-4px}
.lines .hint{line-height:64px;font-size:13px;color:var(--ink-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chip{font-family:var(--f-en);font-size:19px;font-weight:700;border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.used{visibility:hidden}
.orow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);max-height:60vh;overflow:auto;animation:up .2s ease-out}
.sheet.ok{background:var(--ok-soft)}
.sheet.ng{background:var(--ng-soft)}
.sheet-in{max-width:720px;margin:0 auto;display:grid;gap:8px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px}
.sheet.ok h3{color:var(--ok)}
.sheet.ng h3{color:var(--ng)}
.ans{display:flex;gap:10px;align-items:center}
.ans .en{font-size:20px;font-weight:700}
.why{font-size:15px;margin:0}
.why b{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-right:6px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* result */
.result{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:22px;display:grid;gap:16px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.result h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.3}
.bigstars{font-size:48px;letter-spacing:6px;color:var(--accent)}
.bigstars .off{color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper-2);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-soft)}
.news{display:grid;gap:6px}
.new{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.mist{text-align:left;display:grid;gap:8px}
.mist .row{border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px}
.mist .row small{color:var(--ink-soft);font-size:12px}
.mist .row .en{font-weight:700}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:12px;display:grid;gap:4px;justify-items:center;text-align:center}
.badge .ic{font-size:34px;line-height:1.1}
.badge b{font-size:14px}
.badge small{font-size:12px;color:var(--ink-soft)}
.badge.lock{border-style:dashed;border-color:var(--line)}
.badge.lock .ic{filter:grayscale(1);opacity:.35}

/* poster */
.form{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:800;color:var(--ink-soft)}
.field .frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-en);font-size:18px}
.field input{font-family:var(--f-en);font-size:18px;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--paper);color:var(--ink);min-width:0;flex:1 1 140px}
.warn{color:var(--ng);font-size:12px;font-weight:700}
.poster{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:20px;display:grid;gap:4px;box-shadow:0 5px 0 var(--ink)}
.poster h3{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--sa)}
.poster .lines{min-height:64px}
.poster .lines span{font-family:var(--f-en);font-size:26px;line-height:64px;padding-inline:4px}
.note-list{display:grid;gap:8px}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

let AC = null;
function tone(seq){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    seq.forEach(([f, d, st, type, vol]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+st);
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t0+st+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+st+d);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+st); o.stop(t0+st+d+0.03);
    });
  }catch(e){}
}

const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let VOICE = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /^en[-_]US/i.test(v.lang) && /Samantha|Google US|Jenny|Aria|Allison|Ava/i.test(v.name))
         || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(canSpeak){ pickVoice(); try{ speechSynthesis.addEventListener("voiceschanged", pickVoice); }catch(e){} }
function speak(text, slow){
  if(!canSpeak || !text) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\s*—\s*/g, ", "));
    u.lang = "en-US"; if(VOICE) u.voice = VOICE;
    u.rate = (slow || S.settings.slow) ? 0.62 : 0.92;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

  let body = `<h3>${esc(L.t)}</h3><p>${esc(L.b)}</p>`;
  if(L.board) body += `<div class="board" style="--c:${u.c}">${L.board.map(([r, w]) => `<div class="cell"><small>${esc(r)}</small><span>${esc(w)}</span></div>`).join("")}</div><p class="muted">${esc(L.boardJp)}</p>`;
  if(L.table) body += `<div class="tbl"><table><tbody>${L.table.map(r => `<tr>${r.map((c, k) => `<td class="${isJa(c) ? "" : "en"}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(L.ex) body += `<div class="keys">${L.ex.map(k => `<div class="ex">${sayBtn(k[0])}<div><div class="en">${esc(k[0])}</div><div class="jp">${esc(k[1])}</div></div></div>`).join("")}</div>`;
  if(L.tip) body += `<div class="tip"><b>ここに注意</b>${esc(L.tip)}</div>`;
  app.innerHTML = `
  <div class="bar"><button class="link" data-go="unit" data-u="${u.id}">← Unit ${u.id} にもどる</button><span class="muted">${i+1} / ${u.lessons.length}</span></div>
  <article class="lesson">${body}
    <div class="dots" aria-hidden="true">${u.lessons.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
    <div class="navrow">
      <button class="btn" data-go="lesson" data-u="${u.id}" data-i="${i-1}" ${i === 0 ? "disabled" : ""}>前へ</button>
      ${last ? `<button class="btn primary" data-act="start" data-m="vocab" data-u="${u.id}">単語トレーニングへ</button>` : `<button class="btn primary" data-go="lesson" data-u="${u.id}" data-i="${i+1}">次へ</button>`}
    </div>
  </article>`;
}

/* ============ 問題づくり ============ */
function mkVocab(uid, i, forceVariant){
  const V = UNITS[uid].vocab, [en, jp] = V[i];
  const others = sample(range(V.length).filter(j => j !== i && V[j][1] !== jp && V[j][0] !== en), 3).map(j => V[j]);
  const variant = forceVariant || pick(canSpeak ? ["en2jp","en2jp","jp2en","hear"] : ["en2jp","jp2en"]);
  const base = {id:`${uid}:v:${i}`, kind:"vocab", uid, say:en};
  if(variant === "jp2en") return Object.assign(base, {prompt:jp, big:true, sub:"英語にすると？", options:shuffle([en, ...others.map(o => o[0])]), answer:en, why:`「${jp}」は ${en}。`});
  if(variant === "hear") return Object.assign(base, {listen:true, prompt:"聞こえた単語はどれ？", options:shuffle([en, ...others.map(o => o[0])]), answer:en, why:`${en} は「${jp}」。`, reveal:en});
  return Object.assign(base, {prompt:en, promptEn:true, big:true, sub:"意味はどれ？", options:shuffle([jp, ...others.map(o => o[1])]), answer:jp, why:`${en} は「${jp}」。`, autoSay:true});
}
function mkGrammar(uid, i){
  const g = UNITS[uid].grammar[i], ans = g.o[0];
  const full = /\( \)/.test(g.q) && !isJa(g.q) ? g.q.replace("( )", ans) : (!isJa(ans) ? ans : "");
  return {id:`${uid}:g:${i}`, kind:"grammar", uid, prompt:g.q, promptEn:!isJa(g.q), sub:g.s || "", options:shuffle(g.o), answer:ans, why:g.why, say:full, showFull:full !== ans ? full : ""};
}
function splitSentence(en){
  const m = en.match(/^(.*?)([.?!])$/);
  return {words:(m ? m[1] : en).split(" "), punct:m ? m[2] : ""};
}
function mkOrder(uid, i){
  const o = UNITS[uid].order[i], sp = splitSentence(o.en);
  const all = sp.words.concat(o.x || []).map((w, k) => ({k, w}));
  let pool = shuffle(all), tries = 0;
  while(tries++ < 10 && pool.slice(0, sp.words.length).map(t => t.w).join(" ") === sp.words.join(" ")) pool = shuffle(all);
  return {id:`${uid}:o:${i}`, kind:"order", uid, prompt:o.jp, sub:"英語の語順にならべよう", words:sp.words, punct:sp.punct, pool, placed:[], answer:o.en, say:o.en, why:o.why, extra:(o.x || []).length};
}
function mkListen(uid, i){
  const l = UNITS[uid].listen[i];
  return {id:`${uid}:l:${i}`, kind:"listen", uid, listen:true, prompt:"英語を聞いて、意味を選ぼう", say:l.en, reveal:l.en, options:shuffle([l.jp, ...l.ng]), answer:l.jp, why:`${l.en} は「${l.jp}」。`};
}
function fromId(id){
  const [u, k, i] = id.split(":"), uid = +u, idx = +i;
  if(!UNITS[uid]) return null;
  const f = {v:mkVocab, g:mkGrammar, o:mkOrder, l:mkListen}[k];
  const src = {v:"vocab", g:"grammar", o:"order", l:"listen"}[k];
  if(!f || !UNITS[uid][src][idx]) return null;
  return f(uid, idx);
}
function describeId(id){
  const [u, k, i] = id.split(":"), U = UNITS[+u];
  if(!U) return null;
  if(k === "v"){ const v = U.vocab[+i]; return v && {tag:"単語", q:v[0], a:v[1]}; }
  if(k === "g"){ const g = U.grammar[+i]; return g && {tag:"文法", q:g.q, a:g.o[0]}; }
  if(k === "o"){ const o = U.order[+i]; return o && {tag:"ならべかえ", q:o.jp, a:o.en}; }
  if(k === "l"){ const l = U.listen[+i]; return l && {tag:"リスニング", q:l.en, a:l.jp}; }
  return null;
}
function attackQ(){
  const uid = Math.floor(Math.random()*UNITS.length), U = UNITS[uid];
  return Math.random() < 0.5 ? mkVocab(uid, Math.floor(Math.random()*U.vocab.length), pick(["en2jp","jp2en"])) : mkGrammar(uid, Math.floor(Math.random()*U.grammar.length));
}

/* ============ セッション ============ */
let timer = null;
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
function startQuiz(mode, uid){
  let qs = [];
  const U = UNITS[uid];
  if(mode === "vocab") qs = sample(range(U.vocab.length), 8).map(i => mkVocab(uid, i));
  if(mode === "grammar") qs = sample(range(U.grammar.length), 8).map(i => mkGrammar(uid, i));
  if(mode === "order") qs = sample(range(U.order.length), 6).map(i => mkOrder(uid, i));
  if(mode === "listen") qs = sample(range(U.listen.length), 6).map(i => mkListen(uid, i));
  if(mode === "boss") qs = shuffle([
    ...sample(range(U.vocab.length), 3).map(i => mkVocab(uid, i)),
    ...sample(range(U.grammar.length), 3).map(i => mkGrammar(uid, i)),
    ...sample(range(U.order.length), 2).map(i => mkOrder(uid, i)),
    ...sample(range(U.listen.length), 2).map(i => mkListen(uid, i))
  ]);
  if(mode === "review") qs = shuffle(S.wrong).slice(0, 10).map(fromId).filter(Boolean);
  if(mode === "attack") qs = [attackQ()];
  if(!qs.length) return;
  Q = {mode, uid, qs, i:0, ok:0, miss:0, combo:0, maxCombo:0, hearts:3, hp:8, hpMax:8, xp:0, lvBefore:level(S.xp), badgesBefore:S.badges.slice(), answered:false, mistakes:[], timeLeft:60, quitArm:false};
  view = {name:"quiz"};
  render();
  window.scrollTo(0, 0);
  if(mode === "attack"){
    const end = Date.now() + 60000;
    timer = setInterval(() => {
      Q.timeLeft = Math.max(0, (end - Date.now())/1000);
      const t = document.getElementById("timer");
      if(t){ t.textContent = Math.ceil(Q.timeLeft); t.classList.toggle("low", Q.timeLeft <= 10); }
      if(Q.timeLeft <= 0){ stopTimer(); finish(); }
    }, 200);
  }
}
const cur = () => Q.qs[Q.i];

function renderQuiz(){
  const q = cur();
  Q.answered = false;
  let right = "";
  if(Q.mode === "boss") right = `<span class="hearts" aria-label="ライフ${Q.hearts}">${"♥".repeat(Q.hearts)}<span class="off">${"♥".repeat(3-Q.hearts)}</span></span>`;
  else if(Q.mode === "attack") right = `<span class="timer" id="timer" aria-label="残り秒数">${Math.ceil(Q.timeLeft)}</span>`;
  else right = `<span class="muted" style="font-variant-numeric:tabular-nums">${Q.i+1}/${Q.qs.length}</span>`;
  const pct = Q.mode === "attack" ? Math.min(100, Q.ok*100/20) : Q.i*100/Q.qs.length;
  const U = UNITS[Q.uid];
  const boss = Q.mode === "boss" ? `<div class="bossbox" id="bossbox"><span class="mon" id="mon" aria-hidden="true">${U.boss.e}</span><div><b>${esc(U.boss.n)}</b><div class="hp"><i id="hpbar" style="width:${Q.hp*100/Q.hpMax}%"></i></div><small id="hptext">HP ${Q.hp} / ${Q.hpMax}</small></div></div>` : "";
  const combo = Q.combo >= 2 ? `<div style="text-align:center"><span class="combo">${Q.combo} コンボ！</span></div>` : "";
  app.innerHTML = `
  <div class="qtop"><button class="x" data-act="quit">${Q.quitArm ? "やめる？" : "✕"}</button><div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>${right}</div>
  ${boss}${combo}
  <section class="qcard" id="qcard">
    <span class="tag">${TAGS[q.kind]}${Q.mode === "review" || Q.mode === "attack" ? "・Unit " + q.uid : ""}</span>
    ${qBody(q)}
  </section>`;
  if(q.kind !== "order" && (q.listen || q.autoSay)) setTimeout(() => speak(q.say), 250);
}
function qBody(q){
  let h = "";
  if(q.listen){
    h += `<div class="prompt" style="text-align:center">${esc(q.prompt)}</div>`;
    if(canSpeak) h += `<div class="listen"><button class="bigsay" data-say="${esc(q.say)}" aria-label="もう一度聞く">🔊</button><button class="bigsay slow" data-say-slow="${esc(q.say)}" aria-label="ゆっくり聞く">🐢</button></div>
      <div class="reveal en" id="reveal"><button class="link" data-act="reveal">英文を見る</button></div>`;
    else h += `<div class="reveal en">${esc(q.reveal)}</div><p class="sub" style="text-align:center">読み上げが使えないため、英文を表示しています。</p>`;
  } else {
    const cls = ["prompt", q.promptEn ? "en" : "", q.big ? "big" : ""].join(" ");
    h += `<div class="${cls}">${q.kind === "grammar" ? blankify(q.prompt) : esc(q.prompt)}</div>`;
    if(q.sub) h += `<div class="sub">${esc(q.sub)}</div>`;
    if(q.autoSay && canSpeak) h += `<div style="text-align:center">${sayBtn(q.say, "もう一度聞く")}</div>`;
  }
  if(q.kind === "order") return h + orderArea(q);
  const long = q.options.some(o => o.length > (isJa(o) ? 9 : 14));
  h += `<div class="opts ${long ? "one" : ""}">${q.options.map((o, k) => `<button class="opt ${isJa(o) ? "" : "en"}" data-act="ans" data-k="${k}"><span class="k">${k+1}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>`;
  return h;
}
function orderArea(q){
  const placed = q.placed.map(k => q.pool.find(t => t.k === k));
  return `<div class="lines" id="lines">${placed.length ? placed.map(t => `<button class="w" data-act="o-out" data-k="${t.k}" aria-label="${esc(t.w)} をもどす">${esc(t.w)}</button>`).join("") + `<span class="pt">${esc(q.punct)}</span>` : '<span class="hint">下の語をタップして、ここに英文を書こう</span>'}</div>
  <div class="pool" id="pool">${q.pool.map(t => `<button class="chip ${q.placed.includes(t.k) ? "used" : ""}" data-act="o-in" data-k="${t.k}" ${q.placed.includes(t.k) ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(t.w)}</button>`).join("")}</div>
  ${q.extra ? `<p class="sub">使わない語が ${q.extra} つまじっています。</p>` : ""}
  <div class="orow"><button class="btn" data-act="o-clear">やり直す</button><button class="btn primary" data-act="o-check" ${q.placed.length ? "" : "disabled"}>こたえる</button></div>`;
}
function refreshOrder(){
  const q = cur(), card = document.getElementById("qcard");
  if(!card) return;
  const old = card.querySelector(".lines");
  const wrap = document.createElement("div");
  wrap.innerHTML = orderArea(q);
  // replace order area (lines, pool, note, row)
  let n = old;
  const toRemove = [];
  while(n){ toRemove.push(n); n = n.nextElementSibling; }
  toRemove.forEach(e => e.remove());
  Array.from(wrap.children).forEach(c => card.appendChild(c));
}

/* ============ 採点 ============ */
function answer(given){
  if(Q.answered) return;
  Q.answered = true;
  const q = cur();
  const ok = given === q.answer;
  if(q.kind !== "order"){
    document.querySelectorAll(".opt").forEach(b => {
      const t = q.options[+b.dataset.k];
      b.disabled = true;
      if(t === q.answer) b.classList.add("is-ok");
      else if(t === given) b.classList.add("is-ng");
    });
  } else {
    document.querySelectorAll("#qcard button").forEach(b => b.disabled = true);
  }
  if(ok){
    Q.ok++; Q.combo++; Q.maxCombo = Math.max(Q.maxCombo, Q.combo);
    S.stats.ok++; S.stats.maxCombo = Math.max(S.stats.maxCombo, Q.combo);
    if(q.kind === "order") S.stats.order++;
    if(Q.mode === "review"){ S.stats.review++; }
    S.wrong = S.wrong.filter(id => id !== q.id);
    const gain = Q.mode === "attack" ? 5 : 10 + Math.min(10, Math.max(0, Q.combo-2)*2);
    Q.xp += gain;
    SFX.ok();
    if(Q.mode === "boss") bossHit();
  } else {
    Q.miss++; Q.combo = 0;
    if(!S.wrong.includes(q.id)) S.wrong.push(q.id);
    if(S.wrong.length > 80) S.wrong = S.wrong.slice(-80);
    Q.mistakes.push({q, given});
    SFX.ng();
    const card = document.getElementById("qcard");
    if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
    if(Q.mode === "boss") bossAttack();
  }
  save();
  if(Q.mode === "attack"){
    setTimeout(() => { if(view.name !== "quiz" || !timer) return; Q.qs.push(attackQ()); Q.i++; renderQuiz(); }, ok ? 300 : 1100);
    return;
  }
  showSheet(ok, q, given);
}
function bossHit(){
  Q.hp = Math.max(0, Q.hp - 1);
  const m = document.getElementById("mon"), box = document.getElementById("bossbox");
  if(m){ m.classList.remove("hit"); void m.offsetWidth; m.classList.add("hit"); }
  const bar = document.getElementById("hpbar"); if(bar) bar.style.width = (Q.hp*100/Q.hpMax) + "%";
  const tx = document.getElementById("hptext"); if(tx) tx.textContent = `HP ${Q.hp} / ${Q.hpMax}`;
  if(box){ const d = document.createElement("span"); d.className = "dmg"; d.textContent = Q.combo >= 3 ? `${Q.combo}コンボ！` : "HIT!"; box.appendChild(d); setTimeout(() => d.remove(), 900); }
  setTimeout(SFX.hit, 120);
}
function bossAttack(){
  Q.hearts = Math.max(0, Q.hearts - 1);
  const m = document.getElementById("mon");
  if(m){ m.classList.remove("atk"); void m.offsetWidth; m.classList.add("atk"); }
  const h = document.querySelector(".hearts");
  if(h) h.innerHTML = "♥".repeat(Q.hearts) + `<span class="off">${"♥".repeat(3-Q.hearts)}</span>`;
}
function showSheet(ok, q, given){
  const praise = ok ? pick(["せいかい！","ナイス！","すばらしい！","その調子！"]) : "おしい！";
  const full = q.kind === "order" ? q.answer : (q.showFull || q.answer);
  const showAns = !ok || q.kind === "order" || q.showFull;
  const sayText = q.say || (!isJa(q.answer) ? q.answer : "");
  sheetRoot.innerHTML = `<div class="sheet ${ok ? "ok" : "ng"}" role="status">
    <div class="sheet-in">
      <h3>${praise}${ok && Q.combo >= 3 ? `　${Q.combo}コンボ` : ""}</h3>
      ${showAns ? `<div class="ans">${sayText ? sayBtn(sayText) : ""}<span class="${isJa(full) ? "" : "en"}">${!ok ? "正解　" : ""}${esc(full)}</span></div>` : ""}
      ${q.listen && q.reveal && !ok ? `<div class="muted en">${esc(q.reveal)}</div>` : ""}
      <p class="why"><b>なぜ？</b>${esc(q.why)}</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn ${ok ? "primary" : "gold"}" id="next" data-act="next">${isLast() ? "結果を見る" : "つぎへ"}</button></div>
    </div></div>`;
  app.style.paddingBottom = (sheetRoot.firstElementChild.offsetHeight + 24) + "px";
  const nb = document.getElementById("next"); if(nb) nb.focus({preventScroll:true});
  if(ok && q.kind === "order") speak(q.say);
}
function isLast(){
  if(Q.mode === "boss") return Q.hp <= 0 || Q.hearts <= 0 || Q.i >= Q.qs.length - 1;
  return Q.i >= Q.qs.length - 1;
}
function closeSheet(){ sheetRoot.innerHTML = ""; app.style.paddingBottom = ""; }
function next(){
  closeSheet();
  if(isLast()) return finish();
  Q.i++; Q.quitArm = false;
  renderQuiz();
  window.scrollTo(0, 0);
}

/* ============ 結果 ============ */
function finish(){
  stopTimer(); closeSheet();
  const R = {mode:Q.mode, uid:Q.uid, ok:Q.ok, total:Q.mode === "attack" ? Q.ok + Q.miss : Math.min(Q.qs.length, Q.i + 1), maxCombo:Q.maxCombo, mistakes:Q.mistakes, stars:0, win:false, newBest:false};
  if(Q.mode === "boss"){
    R.win = Q.hp <= 0;
    if(R.win) R.stars = Q.miss === 0 ? 3 : Q.miss === 1 ? 2 : 1;
    if(R.win){
      Q.xp += 50 + R.stars*20;
      S.stars[Q.uid] = Math.max(S.stars[Q.uid] || 0, R.stars);
    }
  }
  if(Q.mode === "attack"){ if(Q.ok > S.best.attack){ S.best.attack = Q.ok; R.newBest = true; } }
  if(["vocab","grammar","order","listen","boss"].includes(Q.mode)){
    const pct = Math.round(Q.ok*100/R.total);
    const key = Q.uid + "-" + Q.mode;
    if(Q.mode !== "boss") S.seen[key] = Math.max(S.seen[key] || 0, pct);
  }
  S.xp += Q.xp;
  checkBadges(R);
  R.xp = Q.xp;
  R.lvUp = level(S.xp) > Q.lvBefore ? level(S.xp) : 0;
  R.newBadges = S.badges.filter(b => !Q.badgesBefore.includes(b));
  save();
  view = {name:"result", R};
  render();
  window.scrollTo(0, 0);
  if(R.win || R.lvUp || R.newBest) { SFX.win(); confetti(); }
  else if(Q.mode === "boss") SFX.lose();
}
function checkBadges(R){
  const add = b => { if(!S.badges.includes(b)) S.badges.push(b); };
  if(S.stats.ok >= 1) add("first");
  if(R && R.win) add("boss1");
  if(R && R.win && R.stars === 3) add("perfect");
  if(S.stats.maxCombo >= 10) add("combo10");
  if(S.stats.order >= 20) add("order20");
  if(S.stats.review >= 10) add("review10");
  if(S.best.attack >= 15) add("attack15");
  if(UNITS.every(u => (S.stars[u.id] || 0) > 0)) add("allboss");
}
function renderResult(){
  const R = view.R, U = UNITS[R.uid];
  let title = "トレーニング完了！";
  if(R.mode === "boss") title = R.win ? `${U.boss.n}をたおした！` : `${U.boss.n}に負けてしまった…`;
  if(R.mode === "attack") title = R.newBest ? "最高記録を更新！" : "タイムアップ！";
  if(R.mode === "review") title = "復習完了！";
  const bossFace = R.mode === "boss" ? `<div style="font-size:64px;line-height:1;${R.win ? "opacity:.35;transform:rotate(180deg)" : ""}" aria-hidden="true">${U.boss.e}</div>` : "";
  const again = R.mode === "attack" ? `<button class="btn primary" data-act="attack">もう一度</button>` :
    R.mode === "review" ? (S.wrong.length ? `<button class="btn primary" data-act="start" data-m="review" data-u="0">続けて復習</button>` : "") :
    `<button class="btn primary" data-act="start" data-m="${R.mode}" data-u="${R.uid}">もう一度</button>`;
  const back = R.mode === "attack" || R.mode === "review" ? `<button class="btn" data-go="home">地図へ</button>` : `<button class="btn" data-go="unit" data-u="${R.uid}">Unit ${R.uid} へ</button>`;
  const tip = R.mode === "boss" && !R.win ? `<p class="muted" style="margin:0">ポイント解説を見直してから、もう一度挑戦しよう。まちがえた問題はまちがいノートに入っています。</p>` : "";
  app.innerHTML = `
  <section class="result">
    ${bossFace}
    <h2>${esc(title)}</h2>
    ${R.mode === "boss" && R.win ? `<div class="bigstars" aria-label="星${R.stars}個">${starStr(R.stars)}</div>` : ""}
    ${tip}
    <div class="stats">
      <div class="stat"><b>${R.ok}/${R.total}</b><small>正解</small></div>
      <div class="stat"><b>${R.maxCombo}</b><small>最大コンボ</small></div>
      <div class="stat"><b>+${R.xp}</b><small>XP</small></div>
    </div>
    ${R.lvUp || R.newBadges.length ? `<div class="news">${R.lvUp ? `<div class="new">レベルアップ！ Lv ${R.lvUp}「${rankOf(R.lvUp)}」になった</div>` : ""}${R.newBadges.map(b => { const B = BADGES.find(x => x[0] === b); return `<div class="new">${B[1]} バッジ獲得「${B[2]}」</div>`; }).join("")}</div>` : ""}
    ${R.mistakes.length ? `<div class="mist"><h3 class="sec-h" style="margin:4px 0 0">まちがえた問題</h3>${R.mistakes.slice(0, 10).map(({q, given}) => `
      <div class="row"><small>${TAGS[q.kind]}・Unit ${q.uid}　${esc(q.listen ? q.reveal : q.prompt)}</small>
      <span>あなたの答え <span class="${isJa(given) ? "" : "en"}" style="text-decoration:line-through">${esc(given || "（なし）")}</span></span>
      <span>正解 <span class="${isJa(q.answer) ? "" : "en"}">${esc(q.answer)}</span></span></div>`).join("")}</div>` : ""}
    <div class="btnrow">${again}${back}</div>
  </section>`;
}

/* ============ まちがいノート ============ */
function renderNote(){
  const items = S.wrong.map(id => describeId(id)).filter(Boolean);
  app.innerHTML = `
  <div class="bar"><button class="link" data-go="home">← 地図にもどる</button></div>
  <section class="lesson">
    <h3>まちがいノート</h3>
    <p>まちがえた問題がここにたまります。復習で正解すると、ノートから消えます。</p>
    ${items.length ? `<button class="btn primary" data-act="start" data-m="review" data-u="0" style="justify-self:start">復習する（最大10問）</button>` : ""}
    <div class="mist note-list">${items.length ? items.map(d => `<div class="row"><small>${d.tag}</small><span class="${isJa(d.q) ? "" : "en"}">${esc(d.q)}</span><span class="muted">正解 <span class="${isJa(d.a) ? "" : "en"}">${esc(d.a)}</span></span></div>`).join("") : '<p class="muted">まだありません。島で問題に挑戦しよう。</p>'}</div>
  </section>`;
}

/* ============ バッジ ============ */
function renderBadges(){
  app.innerHTML = `
  <div class="bar"><button class="link" data-go="home">← 地図にもどる</button><span class="muted">${S.badges.length} / ${BADGES.length}</span></div>
  <h2 style="font-family:var(--f-display);font-weight:400;font-size:26px;margin:8px 0 14px">バッジ</h2>
  <div class="badges">${BADGES.map(([id, ic, name, cond]) => `<div class="badge ${S.badges.includes(id) ? "" : "lock"}"><span class="ic" aria-hidden="true">${ic}</span><b>${name}</b><small>${cond}</small></div>`).join("")}</div>
  <p class="foot">正解数 ${S.stats.ok}　最大コンボ ${S.stats.maxCombo}　ならべかえ正解 ${S.stats.order}</p>`;
}

/* ============ 自己紹介ポスター（Stage Activity） ============ */
const POSTER_FIELDS = [
  ["name","名前（Unit 1）","I'm","",".","Haruto"],
  ["from","出身・住んでいる所（Unit 1）","I'm from","",".","Chiba"],
  ["like","好きなもの（Unit 1）","I like","",".","baseball and ramen"],
  ["can","できること（Unit 2）","I can","",".","play the drums"],
  ["day","毎日すること（Unit 1・4）","I","every day",".","practice baseball"],
  ["ask","みんなへの質問（Unit 1）","Do you like","","?","baseball"]
];
function renderPoster(){
  const P = S.poster || {};
  const val = f => P[f[0]] != null ? P[f[0]] : f[5];
  app.innerHTML = `
  <div class="bar"><button class="link" data-go="home">← 地図にもどる</button></div>
  <section class="lesson">
    <h3>"All about Me" ポスター</h3>
    <p>Unit 1〜4 で学んだ英語を使って、自己紹介ポスターを作ろう。最初は例が入っています。自分のことに書きかえてね。</p>
    <div class="form">${POSTER_FIELDS.map(f => `
      <div class="field"><label for="pf-${f[0]}">${f[1]}</label>
        <div class="frame"><span>${esc(f[2])}</span><input id="pf-${f[0]}" data-pf="${f[0]}" value="${esc(val(f))}" autocomplete="off" spellcheck="false"><span>${esc(f[3])}${f[4]}</span></div>
        <span class="warn" id="pw-${f[0]}"></span></div>`).join("")}
    </div>
  </section>
  <h3 class="sec-h">できあがり</h3>
  <div class="poster" id="poster"></div>
  <div class="btnrow" style="margin-top:14px">${canSpeak ? `<button class="btn primary" data-act="poster-say">🔊 読み上げる</button>` : ""}<button class="btn" data-act="poster-reset">例にもどす</button></div>`;
  drawPoster();
}
function posterLines(){
  const P = S.poster || {};
  return POSTER_FIELDS.map(f => {
    const v = (P[f[0]] != null ? P[f[0]] : f[5]).trim();
    if(!v) return "";
    return [f[2], v, f[3]].filter(Boolean).join(" ") + f[4];
  }).filter(Boolean);
}
function drawPoster(){
  const el = document.getElementById("poster");
  if(!el) return;
  const lines = posterLines();
  el.innerHTML = `<h3>All about Me</h3>${lines.map(l => `<div class="lines"><span>${esc(l)}</span></div>`).join("")}`;
  POSTER_FIELDS.forEach(f => {
    const w = document.getElementById("pw-" + f[0]);
    const v = (S.poster && S.poster[f[0]] != null) ? S.poster[f[0]] : f[5];
    if(w) w.textContent = isJa(v) ? "英語（ローマ字）で書こう" : "";
  });
}

/* ============ 紙ふぶき ============ */
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("fx"); cv.hidden = false;
  const ctx = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--ok","--deep","--ng","--u5"].map(v => cs.getPropertyValue(v).trim() || "#F2A900");
  const ps = range(110).map(() => ({x:W/2 + (Math.random()-.5)*80, y:H*0.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+4, c:pick(cols), a:Math.random()*6}));
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
    if(t - t0 < 2200) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

/* ============ イベント ============ */
document.addEventListener("click", e => {
  const sayEl = e.target.closest("[data-say],[data-say-slow]");
  if(sayEl){ speak(sayEl.dataset.say || sayEl.dataset.saySlow, !!sayEl.dataset.saySlow); return; }
  const g = e.target.closest("[data-go]");
  if(g){
    SFX.tap();
    const p = {};
    if(g.dataset.u != null) p.u = +g.dataset.u;
    if(g.dataset.i != null) p.i = +g.dataset.i;
    if(g.dataset.go === "lesson" && p.i < 0) return;
    if(view.name === "quiz" && Q) Q = null;
    go(g.dataset.go, p);
    return;
  }
  const a = e.target.closest("[data-act]");
  if(!a) return;
  const act = a.dataset.act;
  if(act === "start"){ SFX.tap(); startQuiz(a.dataset.m, +a.dataset.u); return; }
  if(act === "attack"){ SFX.tap(); startQuiz("attack", 0); return; }
  if(act === "settings"){ view.settings = !view.settings; view.resetArm = false; render(); return; }
  if(act === "share"){ view.share = !view.share; view.copied = false; render(); if(view.share) drawQR(); return; }
  if(act === "copy"){
    const inp = document.getElementById("share-url");
    const done = () => { view.copied = true; a.textContent = "コピーしました"; };
    try{ navigator.clipboard.writeText(APP_URL).then(done, () => { inp.select(); }); }catch(e){ inp.select(); }
    return;
  }
  if(act === "webshare"){ try{ navigator.share({title:"英語アイランドクエスト", text:"中1英語 Unit 0〜5 を島めぐりゲームで復習しよう！", url:APP_URL}).catch(() => {}); }catch(e){} return; }
  if(act === "install"){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); if(view.share) drawQR(); }); } return; }
  if(act === "t-sound"){ S.settings.sound = !S.settings.sound; save(); render(); SFX.tap(); return; }
  if(act === "t-slow"){ S.settings.slow = !S.settings.slow; save(); render(); speak("Nice to meet you."); return; }
  if(act === "reset"){
    if(!view.resetArm){ view.resetArm = true; render(); return; }
    S = defaults(); save(); view = {name:"home"}; render(); return;
  }
  if(act === "quit"){
    if(!Q.quitArm){ Q.quitArm = true; a.textContent = "やめる？"; setTimeout(() => { if(Q && Q.quitArm){ Q.quitArm = false; const x = document.querySelector(".x"); if(x) x.textContent = "✕"; } }, 2500); return; }
    const m = Q.mode, u = Q.uid; Q = null;
    go(m === "attack" || m === "review" ? "home" : "unit", {u});
    return;
  }
  if(act === "reveal"){ const r = document.getElementById("reveal"); if(r) r.textContent = cur().reveal; return; }
  if(act === "ans"){ answer(cur().options[+a.dataset.k]); return; }
  if(act === "next"){ next(); return; }
  if(act === "o-in" || act === "o-out" || act === "o-clear"){
    const q = cur(); if(Q.answered) return;
    const k = +a.dataset.k;
    if(act === "o-in" && !q.placed.includes(k)){ q.placed.push(k); SFX.tap(); const t = q.pool.find(x => x.k === k); if(t && S.settings.sound) speak(t.w); }
    if(act === "o-out") q.placed = q.placed.filter(x => x !== k);
    if(act === "o-clear") q.placed = [];
    refreshOrder();
    return;
  }
  if(act === "o-check"){
    const q = cur();
    const s = q.placed.map(k => q.pool.find(t => t.k === k).w).join(" ") + q.punct;
    answer(s === q.answer ? q.answer : s);
    return;
  }
  if(act === "poster-say"){ speak(posterLines().join(" ")); return; }
  if(act === "poster-reset"){ S.poster = null; save(); renderPoster(); return; }
});
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.pf;
  if(!f) return;
  S.poster = S.poster || {};
  POSTER_FIELDS.forEach(pf => { if(S.poster[pf[0]] == null) S.poster[pf[0]] = pf[5]; });
  S.poster[f] = e.target.value;
  if(POSTER_FIELDS.every(pf => (S.poster[pf[0]] || "").trim() && !isJa(S.poster[pf[0]])) && POSTER_FIELDS.some(pf => S.poster[pf[0]] !== pf[5])){
    if(!S.badges.includes("poster")) S.badges.push("poster");
  }
  save(); drawPoster();
});
document.addEventListener("keydown", e => {
  if(view.name !== "quiz" || !Q || e.target.tagName === "INPUT") return;
  const q = cur();
  if(!Q.answered && q.kind !== "order" && /^[1-4]$/.test(e.key)){
    const o = q.options[+e.key - 1]; if(o != null) answer(o);
  }
});

render();
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
