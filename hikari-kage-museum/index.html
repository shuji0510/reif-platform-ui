<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光とかげの美術館</title>
<meta name="description" content="教科書の名画を、絵と題名で楽しく覚える。絵を見て題名、ぼかしあて、神経衰弱など。中学1年美術（レオナルド・ダ・ヴィンチと明暗のドラマ）の無料ブラウザゲーム。">
<meta name="theme-color" content="#171326">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="光とかげ">
<meta property="og:type" content="website">
<meta property="og:title" content="光とかげの美術館">
<meta property="og:description" content="教科書の名画を、絵と題名で楽しく覚えよう。ぼかしあて・神経衰弱・フラッシュカードで遊べる。">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
/* Layout: 暗い展示室の壁にスポットライトが動き、その下に展示室（クイズ）が並ぶ廊下型。問題画面は1枚の作品カード、答えは下からせり上がる解説パネル */
:root{
  --wall:#EDE9F5; --wall-2:#E1DCEE; --panel:#FFFFFF; --ink:#1C1833; --ink-soft:#5A5575; --line:#CDC6E0;
  --gold:#A8680A; --gold-soft:#FBEBC8; --gold-ink:#4A2F00; --lamp:#F0B33A;
  --ok:#1D7A55; --ok-soft:#D8F0E4; --ng:#B3382B; --ng-soft:#F9DEDA;
  --hero-bg:#171326; --hero-ink:#F4ECDD; --hero-soft:#B9B1D1;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#12101D; --wall-2:#1A1730; --panel:#201C36; --ink:#F2EBDD; --ink-soft:#A9A2C0; --line:#383257;
    --gold:#F2B544; --gold-soft:#3B2E12; --gold-ink:#FFE3A6; --lamp:#FFC95C;
    --ok:#4CC995; --ok-soft:#10382B; --ng:#FF8470; --ng-soft:#40201C; --hero-bg:#0C0A16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#12101D; --wall-2:#1A1730; --panel:#201C36; --ink:#F2EBDD; --ink-soft:#A9A2C0; --line:#383257;
  --gold:#F2B544; --gold-soft:#3B2E12; --gold-ink:#FFE3A6; --lamp:#FFC95C;
  --ok:#4CC995; --ok-soft:#10382B; --ng:#FF8470; --ng-soft:#40201C; --hero-bg:#0C0A16; color-scheme:dark;
}
@property --lx{syntax:"<percentage>";inherits:false;initial-value:50%}
@property --ly{syntax:"<percentage>";inherits:false;initial-value:42%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
#app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--ink-soft)}
.mincho{font-family:var(--f-display)}

.btn{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--ink);color:var(--wall)}
.btn.gold{background:var(--lamp);color:#2A1A00;border-color:#2A1A00;box-shadow:0 3px 0 #2A1A00}
.btn.small{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:6px 2px;font-weight:700;color:var(--gold)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* hero */
.hero{--lx:50%;--ly:42%;position:relative;isolation:isolate;overflow:hidden;border-radius:22px;background:var(--hero-bg);color:var(--hero-ink);padding:30px 22px 22px;animation:sweep 9s ease-in-out infinite alternate;touch-action:pan-y}
.hero.tracking{animation:none}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle 240px at var(--lx) var(--ly),rgba(255,214,130,.38),rgba(255,214,130,.12) 55%,transparent 78%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.55))}
@keyframes sweep{from{--lx:20%;--ly:36%}to{--lx:80%;--ly:52%}}
.kicker{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--hero-soft);margin:0 0 10px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(42px,11vw,68px);line-height:1.18;letter-spacing:.04em}
.hero h1 em{font-style:normal;color:var(--lamp)}
.lead{margin:14px 0 0;max-width:34em;color:var(--hero-ink);opacity:.9;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:8px 28px;margin-top:22px}
.stats div{min-width:0}
.stats small{display:block;font-size:11px;letter-spacing:.1em;color:var(--hero-soft)}
.stats b{font-family:var(--f-display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.rankbar{grid-column:1/-1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--lamp);border-radius:99px}
.ranknote{grid-column:1/-1;font-size:12px;color:var(--hero-soft);margin-top:-4px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,auto)}}

.sec{font-family:var(--f-display);font-weight:800;font-size:22px;margin:30px 0 12px;text-wrap:wrap}
.sec small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-soft);margin-left:12px;display:inline-block}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.mini canvas,.mini .lk{display:block;width:100%;aspect-ratio:3/2;border-radius:4px;border:2px solid var(--gold);background:var(--wall-2)}
.mini .lk{display:grid;place-items:center;font-family:var(--f-display);color:var(--line);border-style:dashed;border-color:var(--line);font-size:16px}

.rooms{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.rooms{grid-template-columns:1fr 1fr}}
.room{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:transform .12s,border-color .12s;min-width:0}
.room:hover{transform:translateY(-2px);border-color:var(--gold)}
.room:active{transform:translateY(1px)}
.plate{width:46px;height:58px;border:3px double var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--gold);background:var(--gold-soft);flex:none}
.room.done .plate{background:var(--lamp);color:#2A1A00;border-color:#2A1A00}
.room b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.35}
.room small{display:block;color:var(--ink-soft);font-size:13px;line-height:1.55}
.room .meta{margin-top:4px;font-size:12px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.room > div{min-width:0}

.util{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media (min-width:640px){.util{grid-template-columns:repeat(4,1fr)}}
.ub{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px}
.ub:hover{border-color:var(--gold)}
.ub b{font-size:15px}
.ub small{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;display:grid;gap:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:52px;height:30px;border-radius:99px;border:2px solid var(--ink);background:var(--wall-2);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-soft);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:25px;background:#fff}
.share{grid-template-columns:auto 1fr;align-items:start}
@media (max-width:520px){.share{grid-template-columns:1fr}}
.qr{background:#fff;padding:10px;border-radius:12px;border:2px solid var(--ink);width:max-content;max-width:100%;justify-self:center}
.qr svg{display:block;width:150px;height:150px}
.urlrow{display:flex;gap:8px;flex-wrap:wrap}
.urlrow input{flex:1 1 200px;min-width:0;font-family:inherit;font-size:14px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--wall-2);color:var(--ink)}
.howto{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.7}
.foot{font-size:12px;color:var(--ink-soft);margin-top:28px;line-height:1.8}

/* quiz */
.bar{display:flex;align-items:center;gap:12px;margin-block:4px 14px}
.x{border:2px solid var(--line);background:var(--panel);border-radius:999px;height:36px;padding:0 14px;font-weight:700;font-size:14px;flex:none}
.lamps{display:flex;gap:7px;flex:1;min-width:0;flex-wrap:wrap}
.lamp{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);transition:all .25s}
.lamp.now{border-color:var(--ink)}
.lamp.on{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 10px var(--lamp)}
.lamp.bad{background:var(--ng);border-color:var(--ng)}
.hearts{color:var(--ng);letter-spacing:2px;font-size:20px;flex:none}
.hearts .off{color:var(--line)}
.cnt{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.combo{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--gold-soft);color:var(--gold-ink);border-radius:99px;padding:2px 14px;margin-bottom:8px}
.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px;box-shadow:0 14px 34px -22px rgba(20,10,40,.6)}
.chip{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);color:var(--ink-soft);border-radius:99px;padding:2px 12px;background:var(--wall-2)}
.think{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.prompt{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.55}
.sub{font-size:14px;color:var(--ink-soft);margin-top:-8px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.5;min-height:54px;box-shadow:0 3px 0 var(--line);min-width:0}
.opt:hover{border-color:var(--gold)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink-soft)}
.opt .t{min-width:0}
.opts.two .opt{justify-content:center;font-size:24px;font-family:var(--f-display)}
.opts.two .opt .k{display:none}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.is-ng{background:var(--ng-soft);border-color:var(--ng);box-shadow:0 3px 0 var(--ng)}
.opt:disabled{cursor:default}
.hints{display:grid;gap:8px}
.hint{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6}
.hint.open{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);animation:glow .5s}
.hint .hn{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--gold);padding-top:2px;white-space:nowrap}
.hint.open .hn{color:var(--gold-ink)}
.hint.shut{color:var(--ink-soft)}
@keyframes glow{from{box-shadow:0 0 0 0 var(--lamp)}to{box-shadow:0 0 0 12px transparent}}
.pt{font-size:13px;color:var(--ink-soft);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* order */
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-height:58px}
.slot .no{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--wall);display:grid;place-items:center;font-size:13px;font-weight:900}
.slot .box{border:1.5px dashed var(--line);border-radius:12px;min-height:58px;display:flex;align-items:center;padding:4px;color:var(--ink-soft);font-size:13px;min-width:0}
.slot .box .hole{padding-inline:10px}
.oc{display:grid;gap:0;text-align:left;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:8px 12px;line-height:1.4;min-width:0;width:100%}
.oc b{font-family:var(--f-display);font-size:16px}
.oc small{font-size:12px;opacity:.85}
.pool{display:grid;gap:8px}
.pool .oc{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.pool .oc:hover{border-color:var(--gold)}
.pool .oc.used{visibility:hidden}
.orow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* light lab */
.stage{display:grid;justify-items:center;gap:12px}
.stage canvas{width:min(100%,340px);aspect-ratio:1;border-radius:16px;border:2px solid var(--ink);touch-action:none;background:#1e1a30}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pad button{height:56px;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;font-size:22px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.pad button:hover{border-color:var(--gold)}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad button.is-ok{background:var(--ok-soft);border-color:var(--ok)}
.pad button.is-ng{background:var(--ng-soft);border-color:var(--ng)}
.pad .mid{display:grid;place-items:center;color:var(--ink-soft);font-size:11px}

/* lab */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;text-align:center;line-height:1.35;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.tab .ck{position:absolute;top:-6px;right:-4px;background:var(--lamp);color:#2A1A00;border-radius:99px;font-size:10px;padding:0 6px;font-weight:900}
.labcard{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.labcard h3{font-family:var(--f-display);font-size:22px;font-weight:800}
.labcard p{margin:0}
.labcard canvas{width:100%;max-width:420px;justify-self:center;border-radius:14px;border:2px solid var(--ink);touch-action:none;background:#1e1a30}
.range{display:grid;gap:4px}
.range input{width:100%;accent-color:var(--gold);height:32px}
.range div{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-weight:700}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 14px;font-size:14px}
.note b{display:block;font-size:12px;letter-spacing:.08em}
.mirror{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--hero-bg);color:var(--hero-ink);border-radius:14px;padding:18px 12px;min-height:90px}
.mirror span{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6vw,30px);overflow-wrap:anywhere;min-width:0}
.mirror .flipped{transform:scaleX(-1);text-align:left}
.mirror .line{width:6px;align-self:stretch;border-radius:3px;background:linear-gradient(var(--lamp),#fff,var(--lamp))}
.field input{width:100%;font:inherit;font-size:18px;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--panel);color:var(--ink)}
.field label{font-size:13px;font-weight:700;color:var(--ink-soft)}
.field{display:grid;gap:4px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);max-height:68vh;overflow:auto;animation:up .2s ease-out}
.sheet.ok{background:var(--ok-soft)}
.sheet.ng{background:var(--ng-soft)}
.sheet-in{max-width:780px;margin:0 auto;display:grid;gap:8px}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:24px}
.sheet.ok h3{color:var(--ok)}
.sheet.ng h3{color:var(--ng)}
.ans{font-weight:700;font-size:17px}
.why{margin:0;font-size:15px}
.why b{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-right:6px}
.pg{font-size:13px;font-weight:700;color:var(--gold)}
.sheet-art{width:min(100%,260px);border-radius:10px;border:2px solid var(--ink);aspect-ratio:3/2}
.artcap{font-size:11px;color:var(--ink-soft)}
.sheetrow{display:flex;justify-content:space-between;align-items:end;gap:12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* result */
.result{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:16px;text-align:center}
.result h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.4}
.result .lamps{justify-content:center;flex:none}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rstat{background:var(--wall-2);border-radius:12px;padding:10px 6px}
.rstat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rstat small{font-size:12px;color:var(--ink-soft)}
.news{display:grid;gap:6px}
.new{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ucard{display:grid;gap:4px;text-align:left;font-size:12px;font-weight:700}
.ucard canvas{width:100%;aspect-ratio:3/2;border-radius:6px;border:2px solid var(--gold)}
.mist{text-align:left;display:grid;gap:8px}
.mist .row{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px;font-size:14px}
.mist .row small{color:var(--ink-soft);font-size:12px}

/* collection */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cc{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;text-align:left;background:var(--panel);border:1.5px solid var(--gold);border-radius:14px;padding:8px;min-width:0}
.cc canvas{width:100%;aspect-ratio:3/2;border-radius:8px;display:block}
.cc b{font-family:var(--f-display);font-size:15px;line-height:1.4}
.cc small{font-size:12px;color:var(--ink-soft)}
.cc .st{color:var(--gold);letter-spacing:2px;font-size:13px}
.cc.lk{border:1.5px dashed var(--line);cursor:default}
.cc.lk .ph{width:100%;aspect-ratio:3/2;border-radius:8px;background:var(--wall-2);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--line)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,8,20,.7);display:grid;place-items:center;padding:16px}
.mpanel{background:var(--panel);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px;display:grid;gap:12px;border:2px solid var(--gold)}
.mpanel canvas{width:100%;aspect-ratio:3/2;border-radius:10px;border:2px solid var(--ink)}
.mpanel h3{font-family:var(--f-display);font-size:22px;font-weight:800}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.dl dt{color:var(--ink-soft);font-weight:700;font-size:12px;padding-top:2px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* 作品の画像まわり */
.pic{margin:0;background:#0d0b16;border-radius:14px;overflow:hidden;display:grid;place-items:center;border:2px solid var(--ink)}
.pic img{display:block;max-width:100%;max-height:min(46vh,440px);width:auto;height:auto}
.pic.sm img{max-height:min(30vh,260px)}
.sheet .pic img{max-height:22vh}
.zoom{aspect-ratio:4/3;border-radius:14px;border:2px solid var(--ink);background-color:#0d0b16;background-repeat:no-repeat}
.zoom.full{background-size:contain!important;background-position:center!important}
.opts.pics{grid-template-columns:1fr 1fr}
.opts.pics .opt{flex-direction:column;align-items:stretch;gap:6px;padding:6px;min-height:0;position:relative;font-weight:700}
.opts.pics .opt .k{position:absolute;top:10px;left:10px;z-index:1;background:var(--panel)}
.opts.pics .opt img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:8px;background:#0d0b16;display:block}
.opts.pics .opt .cap{display:none;font-size:12px;line-height:1.45;padding:0 4px 2px}
.opts.pics.rev .opt .cap{display:block}
.study{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.study{grid-template-columns:1fr 1fr}}
.big{text-align:left;background:var(--ink);color:var(--wall);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;display:grid;gap:4px;box-shadow:0 4px 0 var(--lamp)}
.big:active{transform:translateY(3px);box-shadow:none}
.big b{font-family:var(--f-display);font-size:20px}
.big small{font-size:13px;opacity:.85;line-height:1.55}
.mini{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.mt{padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#0d0b16;aspect-ratio:3/2}
.mt img{display:block;width:100%;height:100%;object-fit:cover}
.mt.dim img{filter:brightness(.72) saturate(.55)}
.mt.mid{border-color:var(--lamp)}
.mt.gold{border-color:var(--gold);box-shadow:0 0 0 2px var(--lamp)}
.plate.w2{font-size:21px}
.gtoggle{margin:4px 0 14px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.cc img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0d0b16;border-radius:8px;display:block}
.ugrid .ucard{background:none;border:0;padding:0;color:inherit;font:inherit;display:grid;gap:4px;text-align:left;font-size:12px;font-weight:700}
.ugrid .ucard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0d0b16;border-radius:6px;border:2px solid var(--gold);display:block}
.oc.t{grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.oc.t img{grid-row:span 2;width:56px;height:56px;object-fit:cover;border-radius:8px;background:#0d0b16;display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mc{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--hero-bg);color:var(--hero-ink);display:grid;place-items:center;padding:0;overflow:hidden;font-weight:700;font-size:13px;line-height:1.4;min-width:0}
.mc .back{font-family:var(--f-display);font-size:30px;color:var(--lamp)}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc.t{background:var(--gold-soft);color:var(--gold-ink);padding:6px;text-align:center}
.mc.up{border-color:var(--lamp)}
.mc.done{border-color:var(--ok);opacity:.55}
.mc:disabled{cursor:default}
.artcap{font-size:12px;color:var(--ink-soft)}
.util{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

let AC = null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    seq.forEach(([f, d, st, type, vol]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+st);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0+st+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+st+d);
      o.connect(g); g.connect(AC.destination); o.start(t0+st); o.stop(t0+st+d+0.03);
    });
  }catch(e){}
}

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; };
const rgba = (h, a) => { const [r,g,b] = hexRGB(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (h1, h2, t) => { const a = hexRGB(h1), b = hexRGB(h2); return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")})`; };
function vgrad(c, W, H, top, bot){ const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(0,0,W,H); }
function glow(c, W, H, x, y, rad, col, a){ const g = c.createRadialGradient(x,y,0,x,y,rad); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.fillRect(0,0,W,H); }
const TAU = Math.PI * 2;
function ell(c, x, y, rx, ry){ c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); }

  return {key:`b:${bank}:${i}`, kind:"choice", tag:TAGNAME[bank], prompt:b.q, sub:b.sub || "", think:!!b.think, options:tf ? ["○","×"] : shuffle([b.a, ...b.x]), tf, answer:b.a, why:b.why, work:b.work, pg:b.pg};
}
const GENS = {
  artist:{ok:w => true, f(w){ const A = ARTISTS[w.a]; return {prompt:`「${w.t}」をつくったのはだれ？`, options:shuffle([A.n, ...sample(Object.keys(ARTISTS).filter(k => k !== w.a), 3).map(k => ARTISTS[k].n)]), answer:A.n, why:`「${w.t}」は${A.n}（${A.yrs}・${A.land}）の作品。`}; }},
  museum:{ok:w => true, f(w){ const others = [...new Set(WORKS.filter(x => x.place !== w.place).map(x => x.place))]; return {prompt:`「${w.t}」がある美術館（図書館・教会など）は？`, options:shuffle([w.place, ...sample(others, 3)]), answer:w.place, why:`「${w.t}」は${w.place}（${w.land}）にある。`}; }},
  land:{ok:w => true, f(w){ const L = [...new Set(WORKS.map(x => x.land).filter(l => l !== w.land))]; return {prompt:`「${w.t}」を所蔵している場所があるのは、どこ？`, options:shuffle([w.land, ...sample(L, 3)]), answer:w.land, why:`「${w.t}」は${w.place}（${w.land}）にある。`}; }},
  year:{ok:w => w.id !== "dogcat", f(w){ const cand = WORKS.filter(x => x.id !== w.id && x.id !== "dogcat" && x.y !== w.y && Math.abs(x.y0 - w.y0) >= 10); const uniq = [...new Map(cand.map(x => [x.y, x])).values()]; return {prompt:`「${w.t}」がつくられたのは、いつ？`, options:shuffle([w.y, ...sample(uniq, 3).map(x => x.y)]), answer:w.y, why:`「${w.t}」は${w.y}の作品。`}; }},
  tech:{ok:w => !!w.tech, f(w){ const T = ["油彩","テンペラ","ペン・インク","メタルポイント","紙本着色","サンギュイン"].filter(t => t !== w.tech); return {prompt:`「${w.t}」の画材・技法は？`, options:shuffle([w.tech, ...sample(T, 3)]), answer:w.tech, why:`「${w.t}」の画材は「${w.full}」。`}; }}
};
function buildGen(type, wid){
  const w = W[wid], g = GENS[type].f(w);
  return Object.assign({key:`g:${type}:${wid}`, kind:"choice", tag:TAGNAME.g, sub:"", options:[], tf:false, work:wid, pg:w.pg}, g);
}
function buildArtistQ(type, ak){
  const A = ARTISTS[ak], others = Object.keys(ARTISTS).filter(k => k !== ak), pg = ak === "leo" ? 110 : ak === "rem" ? 112 : 113;
  if(type === "life") return {key:`g:life:${ak}`, kind:"choice", tag:TAGNAME.g, prompt:`${A.n}が生きたのは、いつ？`, sub:"", options:shuffle([A.yrs, ...sample(others, 3).map(k => ARTISTS[k].yrs)]), answer:A.yrs, why:`${A.n}は${A.yrs}（${A.land}）。`, pg};
  const lands = ["イタリア","フランス","オランダ","茨城県"];
  return {key:`g:aland:${ak}`, kind:"choice", tag:TAGNAME.g, prompt:`${A.n}は、どこの出身（国・県）？`, sub:"", options:shuffle(lands.includes(A.land) ? lands : [A.land, ...lands.slice(0,3)]), answer:A.land, why:`${A.n}は${A.yrs}（${A.land}）。`, pg};
}
function buildHint(wid){
  const w = W[wid], same = WORKS.filter(x => x.id !== wid && x.a === w.a), diff = WORKS.filter(x => x.id !== wid && x.a !== w.a);
  const ds = [...sample(same, 2), ...sample(diff, 3)].slice(0, 3);
  return {key:`h:${wid}`, kind:"hint", tag:TAGNAME.h, prompt:"この作品は、どれ？", options:shuffle([w.t, ...ds.map(d => d.t)]), answer:w.t, why:w.sum, work:wid, hints:w.hints, used:1, pg:w.pg};
}
/* 絵を見て題名／ぼかしあて／ズーム。まぎらわしさが同じになるよう、絵画は絵画、素描は素描どうしで選択肢をつくる */
function buildPic(type, wid){
  const w = W[wid], ds = sample(sameGroup(w), 3);
  const prompt = {pic2title:"この絵の題名は？", blur:"ぼやけた絵が、だんだんはっきりする。題名は？", zoom:"拡大した部分は、どの作品？"}[type];
  return {key:`p:${type}:${wid}`, kind:"choice", media:type, tag:TAGNAME[type], prompt, sub:"", tf:false, options:shuffle([w.t, ...ds.map(d => d.t)]), answer:w.t, why:w.sum, work:wid, pg:w.pg, zx:20 + Math.random()*60, zy:20 + Math.random()*60};
}
function buildT2P(wid){
  const w = W[wid], ds = sample(sameGroup(w), 3);
  return {key:`p:t2p:${wid}`, kind:"choice", media:"t2p", pics:true, tag:TAGNAME.t2p, prompt:`「${w.t}」は、どの絵？`, sub:"", tf:false, options:shuffle([w.id, ...ds.map(d => d.id)]), answer:w.id, why:w.sum, work:wid, pg:w.pg};
}
function buildMatch(){
  const ws = pickWorks(6);
  return {key:"m", kind:"match", tag:TAGNAME.match, cards:shuffle([...ws.map(w => ({wid:w.id, type:"pic", st:"down"})), ...ws.map(w => ({wid:w.id, type:"title", st:"down"}))]), misses:0, answer:""};
}
function buildOrder(mode){
  if(mode === "time"){
    let ids; do{ ids = sample(PAINT, 4).map(w => w.id); }while(new Set(ids.map(i => W[i].y0)).size < 4);
    const ans = ids.slice().sort((a,b) => W[a].y0 - W[b].y0);
    return {key:"o:time", kind:"order", tag:TAGNAME.o, mode, prompt:"つくられた年が古い順に、ならべよう。", sub:"古いものから上にならべる。", items:shuffle(ids), placed:[], answer:ans, labels:["いちばん古い","2番め","3番め","いちばん新しい"]};
  }
  let ids, ok = false;
  while(!ok){ ids = sample(SIZED, 4).map(w => w.id); const s = ids.slice().sort((a,b) => area(W[b]) - area(W[a])); ok = s.every((id, i) => i === 0 || area(W[s[i-1]]) / area(W[id]) >= 1.2); }
  const ans = ids.slice().sort((a,b) => area(W[b]) - area(W[a]));
  return {key:"o:size", kind:"order", tag:TAGNAME.o, mode, prompt:"画面の大きさが大きい順に、ならべよう。", sub:"たて×よこの面積で考える。大きいものから上にならべる。", items:shuffle(ids), placed:[], answer:ans, labels:["いちばん大きい","2番め","3番め","いちばん小さい"]};
}
function buildLight(i){ return {key:"l", kind:"light", tag:TAGNAME.l, idx:Math.floor(Math.random()*8), variant:i % 2 ? "b" : "a", prompt:"", answer:""}; }
const qText = q => q.kind === "hint" ? `ヒントクイズ「${q.hints[0]}」` : q.kind === "light" ? "光の向きの問題" : q.media === "t2p" ? q.prompt : q.media ? `この絵（${q.tag}）の題名` : q.prompt;
function fromKey(key){
  const [t, a, b] = key.split(":");
  try{
    if(t === "b" && BANKS[a] && BANKS[a][+b]) return buildStatic(a, +b);
    if(t === "g" && (a === "life" || a === "aland") && ARTISTS[b]) return buildArtistQ(a, b);
    if(t === "g" && GENS[a] && W[b]) return buildGen(a, b);
    if(t === "h" && W[a]) return buildHint(a);
    if(t === "p" && W[b] && (a === "pic2title" || a === "blur" || a === "zoom")) return buildPic(a, b);
    if(t === "p" && a === "t2p" && W[b]) return buildT2P(b);
  }catch(e){}
  return null;
}

let Q = null, view = {name:"home"};
function stopTimers(){ if(Q && Q.btimer){ clearInterval(Q.btimer); Q.btimer = null; } }
function genPool(n){
  const types = shuffle(["artist","museum","land","year","tech","life","aland","artist","museum","year"]);
  const used = new Set(), out = [];
  for(const ty of types){
    if(out.length >= n) break;
    if(ty === "life" || ty === "aland"){ out.push(buildArtistQ(ty, pick(Object.keys(ARTISTS)))); continue; }
    const cand = shuffle(WORKS.filter(w => GENS[ty].ok(w) && !used.has(w.id)));
    if(!cand.length) continue;
    used.add(cand[0].id); out.push(buildGen(ty, cand[0].id));
  }
  return out;
}
function startSession(mode){
  stopTimers();
  let qs = [], title = "";
  if(mode === "pic"){ title = "絵を見て、題名"; qs = pickWorks(8).map(w => buildPic("pic2title", w.id)); }
  if(mode === "t2p"){ title = "題名から、絵を選ぶ"; qs = pickWorks(8).map(w => buildT2P(w.id)); }
  if(mode === "blur"){ title = "ぼかしあてクイズ"; qs = pickWorks(6).map(w => buildPic("blur", w.id)); }
  if(mode === "zoom"){ title = "ズームクイズ"; qs = pickWorks(6, WORKS.filter(w => w.zoomOk)).map(w => buildPic("zoom", w.id)); }
  if(mode === "match"){ title = "神経衰弱"; qs = [buildMatch()]; }
  if(mode === "hint"){ title = "この作品なーんだ"; qs = pickWorks(6).map(w => buildHint(w.id)); }
  if(mode === "leo"){ title = "レオナルドの人生"; qs = sample(range(BANKS.leo.length), 8).map(i => buildStatic("leo", i)); }
  if(mode === "data"){ title = "作者・美術館・年代"; qs = genPool(10); }
  if(mode === "order"){ title = "ならべかえ"; qs = ["time","size","time","size"].map(buildOrder); }
  if(mode === "light"){ title = "光の向きチャレンジ"; qs = range(6).map(buildLight); }
  if(mode === "exam"){
    title = "学芸員試験";
    const pk = (bk, n) => sample(range(BANKS[bk].length), n).map(i => buildStatic(bk, i));
    qs = shuffle([...pk("leo",2), ...pk("tech",2), ...pk("light",2), ...genPool(2), ...pickWorks(2).map(w => buildPic("pic2title", w.id)), ...pickWorks(2).map(w => buildT2P(w.id))]);
  }
  if(mode.startsWith("lab:")){

    qs = shuffle(range(BANKS.tech.length).filter(i => BANKS.tech[i].lab === lab)).slice(0, 3).map(i => buildStatic("tech", i));
  }
  if(mode === "review"){ title = "まちがいノート"; qs = sample(S.wrong, 10).map(fromKey).filter(Boolean); }
  if(!qs.length) return;
  Q = {mode, title, qs, i:0, ok:0, miss:0, combo:0, maxCombo:0, xp:0, hearts:3, lamps:qs.map(() => ""), mistakes:[], answered:false, rankBefore:rankInfo(S.xp).i, quitArm:false, lock:false};
  SFX.tap(); go("quiz");
}

/* 神経衰弱 */
function matchCard(c, i){
  const face = c.st !== "down", lbl = face ? (c.type === "pic" ? `${W[c.wid].t}の絵` : W[c.wid].t) : `伏せたカード ${i+1}`;
  return `<button class="mc ${face && c.type === "title" ? "t" : ""} ${c.st === "up" ? "up" : ""} ${c.st === "done" ? "done" : ""}" data-act="m-flip" data-i="${i}" ${face ? "disabled" : ""} aria-label="${esc(lbl)}">${face ? (c.type === "pic" ? imgTag(c.wid, "", "", true) : `<span>${esc(W[c.wid].t)}</span>`) : '<span class="back">光</span>'}</button>`;
}
function renderMatch(){
  const q = cur(), done = q.cards.filter(c => c.st === "done").length / 2;
  app.innerHTML = `<div class="bar"><button class="x" data-act="quit">${Q.quitArm ? "やめる？" : "✕"}</button><div class="lamps" aria-hidden="true">${range(6).map(i => `<span class="lamp ${i < done ? "on" : ""}"></span>`).join("")}</div><span class="cnt">ミス ${q.misses}</span></div>
  <section class="qcard"><span class="chip">神経衰弱</span><div class="prompt">絵と題名のペアを見つけよう。</div><div class="sub">同じ作品の絵と題名を、2枚ずつめくる。ミスが少ないほど高得点。</div><div class="mgrid" id="mgrid">${q.cards.map(matchCard).join("")}</div></section>`;
}
function flipCard(i){
  const q = cur(), c = q.cards[i];
  if(Q.lock || c.st !== "down") return;
  const ses = Q; c.st = "up"; SFX.tap(); renderMatch();
  const ups = q.cards.filter(x => x.st === "up");
  if(ups.length < 2) return;
  Q.lock = true;
  if(ups[0].wid === ups[1].wid){
    setTimeout(() => { if(Q !== ses) return; ups.forEach(x => x.st = "done"); bump(ups[0].wid); Q.lock = false; SFX.ok(); renderMatch(); if(q.cards.every(x => x.st === "done")) finishMatch(); }, 600);
  } else {
    q.misses++; SFX.ng();
    setTimeout(() => { if(Q !== ses) return; ups.forEach(x => x.st = "down"); Q.lock = false; renderMatch(); }, 1100);
  }
}
function finishMatch(){
  const q = cur();
  Q.ok = 6; Q.miss = q.misses; Q.xp = Math.max(10, 60 - 3*q.misses); Q.lamps = range(6).map(() => "on"); Q.maxCombo = 0;
  save(); finish();
}

/* 光の描画。th は光が来る向き（0=右、反時計まわり） */
function drawLight(cv, th, o){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height, cx = W/2, cy = H/2 + 8, r = W*.2;
  const lx = Math.cos(th), ly = -Math.sin(th);
  const g = c.createLinearGradient(cx + lx*W*.5, cy + ly*H*.5, cx - lx*W*.5, cy - ly*H*.5);
  g.addColorStop(0, "#74679a"); g.addColorStop(1, "#1d192e"); c.fillStyle = g; c.fillRect(0,0,W,H);
  c.save(); c.shadowColor = `rgba(6,4,14,${.7*o.sh})`; c.shadowBlur = 18;
  c.fillStyle = `rgba(8,6,16,${.62*o.sh})`; c.beginPath(); c.arc(cx - lx*r*.95, cy - ly*r*.95, r*1.02, 0, TAU); c.fill(); c.restore();
  const sg = c.createRadialGradient(cx + lx*r*.45, cy + ly*r*.45, r*.06, cx, cy, r*1.05);
  sg.addColorStop(0, mix("#9a8f78","#fff3d2",o.hi)); sg.addColorStop(.55, "#9a8f78"); sg.addColorStop(1, mix("#9a8f78","#2a2438",o.hi));
  c.fillStyle = sg; c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
  if(o.marker){
    const mx = cx + lx*W*.4, my = cy + ly*H*.4;
    glow(c, W, H, mx, my, 56, "#FFD36B", .85); c.fillStyle = "#FFE9A8"; c.beginPath(); c.arc(mx, my, 11, 0, TAU); c.fill();
    c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 2; c.beginPath(); c.arc(mx, my, 17, 0, TAU); c.stroke();
  }
}

/* ================= 採点 ================= */
function bump(wid){ if(wid) S.m[wid] = Math.min(3, (S.m[wid] || 0) + 1); }
function record(ok, q, given){
  Q.answered = true;
  if(ok){
    Q.ok++; Q.combo++; Q.maxCombo = Math.max(Q.maxCombo, Q.combo);
    let gain = 10 + Math.min(10, Math.max(0, Q.combo-2)*2);
    if(q.kind === "hint") gain = [0,15,10,5][q.used];
    if(q.media === "blur") gain = q._pts;
    if(q.kind === "order") gain = 20;
    q._gain = gain; Q.xp += gain; Q.lamps[Q.i] = "on";
    if(/^[bghp]:/.test(q.key)) S.wrong = S.wrong.filter(k => k !== q.key);
    if(q.kind === "order") q.answer.forEach(bump); else bump(q.work);
    SFX.ok(); setTimeout(SFX.lamp, 220);
  } else {
    Q.miss++; Q.combo = 0; Q.lamps[Q.i] = "bad";
    if(Q.mode === "exam") Q.hearts--;
    if(/^[bghp]:/.test(q.key) && !S.wrong.includes(q.key)) S.wrong.push(q.key);
    if(S.wrong.length > 60) S.wrong = S.wrong.slice(-60);
    Q.mistakes.push({q, given}); SFX.ng();
    const card = document.getElementById("qcard"); if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  }
  save();
  const lamps = document.querySelector(".lamps"); if(lamps) lamps.innerHTML = lampsHtml();
  showSheet(ok, q, given);
}
function answerChoice(k){
  if(Q.answered) return;
  const q = cur(), given = q.options[k], ok = given === q.answer;
  if(q.media === "blur"){ q._pts = blurPts(performance.now() - q.t0); stopTimers(); const im = document.getElementById("bimg"); if(im) im.style.filter = "none"; }
  if(q.media === "zoom"){ const z = document.getElementById("zoomv"); if(z) z.classList.add("full"); }
  if(q.pics){ const o = document.getElementById("opts"); if(o) o.classList.add("rev"); }
  document.querySelectorAll(".opt").forEach(b => { const t = q.options[+b.dataset.k]; b.disabled = true; if(t === q.answer) b.classList.add("is-ok"); else if(t === given) b.classList.add("is-ng"); });
  record(ok, q, given);
}
function answerOrder(){
  if(Q.answered) return;
  const q = cur(), ok = q.placed.join() === q.answer.join();
  document.querySelectorAll("#qcard button").forEach(b => b.disabled = true);
  record(ok, q, q.placed.map(id => W[id].t).join(" → "));
}
function answerLight(d){
  if(Q.answered) return;
  const q = cur(), ans = DIRS[q.idx], ok = d === ans;
  document.querySelectorAll(".pad button").forEach(b => { b.disabled = true; if(b.dataset.d === ans) b.classList.add("is-ok"); else if(b.dataset.d === d) b.classList.add("is-ng"); });
  q.answer = ans; q.why = q.variant === "a" ? `いちばん明るい所が${ans}がわにあるので、光は${ans}から当たっている。` : `かげが${OPP[ans]}がわにのびているので、光は反対の${ans}から当たっている。`;
  record(ok, q, d);
}
function orderLine(q){ return q.mode === "time" ? q.answer.map(id => `${W[id].t}（${W[id].y}）`).join(" → ") : q.answer.map(id => `${W[id].t}（${fmt(area(W[id]))}cm²）`).join(" ＞ "); }
function showSheet(ok, q, given){
  const praise = ok ? pick(["せいかい！","いいね！","さすが！","その調子！"]) : "おしい！";
  let ans = "";
  if(q.kind === "order") ans = orderLine(q); else if(!ok) ans = optText(q, q.answer);
  const why = q.kind === "order" ? (q.mode === "time" ? "年が小さいほど古い作品。" : "面積は、たて×よこで求める。単位は cm²。") : q.why;

    ${showArt ? `<figure class="pic sm sheetpic">${imgTag(q.work)}</figure><div class="artcap">${esc(facts(W[q.work]))}</div>` : ""}
    <p class="why"><b>なぜ？</b>${esc(why)}</p>
    ${q.pg ? `<div class="pg">教科書 P.${q.pg} で確かめよう</div>` : ""}
    <div class="sheetrow"><span class="pt">${ok ? "+" + (q._gain || 0) + " XP" : ""}</span><button class="btn ${ok ? "primary" : "gold"}" id="next" data-act="next">${last ? "結果を見る" : "つぎへ"}</button></div>
  </div></div>`;

/* ================= 結果 ================= */
function finish(){
  stopTimers(); closeSheet();
  const match = Q.mode === "match";
  const total = match ? 6 + Q.miss : Q.qs.length, pct = Q.ok ? Math.round(Q.ok*100/total) : 0;
  const win = Q.mode === "exam" ? Q.hearts > 0 : true;
  if(Q.mode.startsWith("lab:")){ const id = Q.mode.slice(4); if(Q.ok >= 2){ if(!S.labs[id]) Q.xp += 30; S.labs[id] = true; } }
  else if(Q.mode !== "review"){ const b = S.rooms[Q.mode] || {best:0, plays:0}; b.best = Math.max(b.best, pct); b.plays++; S.rooms[Q.mode] = b; }
  if(Q.mode === "exam" && win) Q.xp += 50;
  S.xp += Q.xp; save();
  const covered = [...new Set(Q.qs.flatMap(q => q.kind === "order" ? q.answer : q.kind === "match" ? q.cards.map(c => c.wid) : q.work ? [q.work] : []))];
  const R = {mode:Q.mode, title:Q.title, ok:Q.ok, total, pct, maxCombo:Q.maxCombo, xp:Q.xp, lamps:Q.lamps.slice(), mistakes:Q.mistakes, covered, win, rankUp:rankInfo(S.xp).i > Q.rankBefore ? rankInfo(S.xp).name : ""};
  view = {name:"result", R}; Q = null; render(); window.scrollTo(0, 0);
  if((R.pct >= 80 && R.win) || R.rankUp){ SFX.win(); confetti(); }
}
function comment(R){
  if(R.mode === "exam" && !R.win) return "ライフがなくなった。まちがいノートで見直して、もう一度挑戦しよう。";
  if(R.mode === "match") return R.total === 6 ? "ミスなしで全部見つけた。" : "ペアを全部見つけた。ミスを減らして、もう一度ためそう。";
  if(R.pct === 100) return "全問正解。絵と題名がしっかりつながっている。";
  if(R.pct >= 80) return "よくできた。あとひと息で、全問正解。";
  if(R.pct >= 50) return "半分以上は正解。下の「今回の作品」で、絵と題名を見直そう。";
  return "最初はこれでじゅうぶん。図鑑やフラッシュカードで見てから、もう一度挑戦しよう。";
}

      <canvas id="lcvs" width="320" height="240" role="img" aria-label="顔の絵。スライダーで輪郭線とぼかしが変わる"></canvas>

      <div class="note"><b>観察しよう</b>口もとのあたりが、どう見えるかな。輪郭がぼやけるほど、顔がやわらかく、ふくらんで見える。</div>`,
    air:`<p>遠ざかるにつれて、色調が淡く、青みを帯びて見える。この見え方を使って奥行きを表す方法を、空気遠近法という。「モナ・リザ」の背景にも使われている。</p>
      <canvas id="lcvs" width="320" height="220" role="img" aria-label="かさなる山の絵。スライダーで遠くの山がかすむ"></canvas>
      <div class="range"><input id="rg" type="range" min="0" max="100" value="0" aria-label="かすみの量"><div><span>すべて同じ色</span><span>遠くほど淡く青い</span></div></div>
      <div class="note"><b>観察しよう</b>かすみの量を増やすと、いちばん遠い山はどう変わる？ 同じ形でも、奥行きが生まれる。</div>`,
    vp:`<p>奥行きを表す線が、画面の一点に集まって見える。この点が消失点。「最後の晩餐」は、この一点透視図法で空間を表している。金色の点を動かしてみよう。</p>
      <canvas id="lcvs" width="320" height="230" tabindex="0" role="img" aria-label="部屋の奥行きの絵。金色の点（消失点）をドラッグして動かせる"></canvas>
      <div class="note" id="vpnote"><b>やってみよう</b>消失点を画面の中央に合わせると、「最後の晩餐」のように、見る人の視線が中心に集まる。</div>`,
    mir:`<p>レオナルドの手稿は、左右が逆の鏡文字で書かれている。自分の言葉を入力して、レオナルド流にしてみよう。右側の鏡に映すと、ふつうの文字にもどる。</p>
      <div class="field"><label for="mirin">ことばを入力（12文字まで）</label><input id="mirin" maxlength="12" value="ひかりとかげ" autocomplete="off"></div>
      <div class="mirror" aria-live="polite"><span class="flipped" id="mflip">ひかりとかげ</span><i class="line" aria-hidden="true"></i><span id="mnorm">ひかりとかげ</span></div>
      <div class="note"><b>ポイント</b>左は鏡文字、右は鏡に映した姿。数千枚もの手稿を、こうして書き残した。</div>`
  }[id];
  app.innerHTML = `<div class="bar"><button class="link" data-go="home">← 展示室にもどる</button></div>
  <h2 class="sec" style="margin-top:6px">技法ラボ<small>さわって、試して、わかる</small></h2>
  <div class="tabs" role="tablist">${LABS.map(l => `<button class="tab" role="tab" aria-selected="${l.id === id}" data-act="tab" data-id="${l.id}">${S.labs[l.id] ? '<span class="ck">済</span>' : ""}${l.n}</button>`).join("")}</div>
  <section class="labcard"><h3>${esc(L.t)}</h3>${body}<button class="btn primary" style="justify-self:start" data-act="start" data-m="lab:${id}">チェック問題（3問）に挑戦</button></section>`;
  initLab(id);
}
function initLab(id){
  const cv = document.getElementById("lcvs"), rg = document.getElementById("rg");
  if(id === "sfu"){ const f = () => drawSfumato(cv, rg.value/100); rg.oninput = f; f(); }
  if(id === "air"){ const f = () => drawAir(cv, rg.value/100); rg.oninput = f; f(); }
  if(id === "vp"){
    const st = {x:.5, y:.46}; const f = () => { drawVP(cv, st); const mid = Math.abs(st.x - .5) < .04; const n = document.getElementById("vpnote"); if(n) n.innerHTML = mid ? "<b>中央にそろった</b>線が画面の中心に集まった。「最後の晩餐」でも、消失点は中央のイエスの頭のあたり。見る人の視線が、自然と中心の人物に向かう。" : "<b>やってみよう</b>消失点を画面の中央に合わせると、「最後の晩餐」のように、見る人の視線が中心に集まる。"; };
    const set = e => { const b = cv.getBoundingClientRect(); st.x = Math.min(.8, Math.max(.2, (e.clientX-b.left)/b.width)); st.y = Math.min(.7, Math.max(.28, (e.clientY-b.top)/b.height)); f(); };
    let down = false; cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); set(e); }; cv.onpointermove = e => { if(down) set(e); }; cv.onpointerup = () => { down = false; };
    cv.onkeydown = e => { const d = {ArrowLeft:[-.03,0],ArrowRight:[.03,0],ArrowUp:[0,-.03],ArrowDown:[0,.03]}[e.key]; if(d){ e.preventDefault(); st.x = Math.min(.8, Math.max(.2, st.x+d[0])); st.y = Math.min(.7, Math.max(.28, st.y+d[1])); f(); } };
    f();
  }
  if(id === "mir"){ const inp = document.getElementById("mirin"), a = document.getElementById("mflip"), b = document.getElementById("mnorm"); inp.oninput = () => { a.textContent = inp.value || "　"; b.textContent = inp.value || "　"; }; }
}
function drawSfumato(cv, t){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  vgrad(c, W, H, "#5d5538", "#2a2515");
  function blob(cx, cy, rx, ry, hi, mid, dark, lx){
    c.save(); c.translate(cx, cy); c.scale(rx, ry);
    const e = 1 - .78*t, g = c.createRadialGradient(lx, -.3, .05, 0, 0, 1);
    g.addColorStop(0, hi); g.addColorStop(Math.max(.05, e*.55), mid); g.addColorStop(e, dark); g.addColorStop(1, rgba(dark, 1 - t));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill(); c.restore();
    if(t < 1){ c.strokeStyle = `rgba(20,12,6,${.9*(1-t)})`; c.lineWidth = 3; c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.stroke(); }
  }
  blob(W*.5, H*1.02, 130, 88, "#a98652", "#7b5a34", "#3f2c18", -.3);
  blob(W*.5, H*.3, 66, 58, "#5b3f27", "#33231a", "#1b120c", -.2);
  blob(W*.5, H*.44, 58, 74, "#f4d9ae", "#cf9f6c", "#7a5533", -.35);
  c.fillStyle = `rgba(40,25,14,${.8})`; [[-22,-4],[22,-4]].forEach(([dx, dy]) => { c.beginPath(); c.ellipse(W*.5+dx, H*.4+dy, 7, 3.5 + 2*t, 0, 0, TAU); c.fill(); });
  c.strokeStyle = `rgba(60,25,15,${.9*(1-.8*t)})`; c.lineWidth = 2.2 + 1.5*t; c.lineCap = "round";
  c.beginPath(); c.moveTo(W*.5-20, H*.56); c.quadraticCurveTo(W*.5, H*.6, W*.5+20, H*.555); c.stroke();
}
function drawAir(cv, t){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height, n = 5, r = rng(7);
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, mix("#6f8fb5","#9ebbd8",t)); sky.addColorStop(1, "#e6ecf1"); c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for(let i = 0; i < n; i++){
    const depth = 1 - i/(n-1), amt = t * (.12 + .88*Math.pow(depth, .8)), base = H*(.34 + i*.12), amp = 34 - i*5;
    c.fillStyle = mix("#2f4d3a", "#a9c0dc", amt); c.beginPath(); c.moveTo(0, H);
    for(let x = 0; x <= W; x += 20) c.lineTo(x, base - amp*(.35 + .65*r())); c.lineTo(W, H); c.fill();
  }
}
function drawVP(cv, st){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height, vx = st.x*W, vy = st.y*H, ww = W*.26, wh = H*.26;
  c.fillStyle = "#1b1830"; c.fillRect(0, 0, W, H);
  const L = vx - ww/2, R = vx + ww/2, T = vy - wh/2, B = vy + wh/2;
  c.fillStyle = "#312b52"; c.fillRect(L, T, ww, wh);
  c.strokeStyle = "#8c84bd"; c.lineWidth = 2;
  [[0,0,L,T],[W,0,R,T],[0,H,L,B],[W,H,R,B]].forEach(l => { c.beginPath(); c.moveTo(l[0], l[1]); c.lineTo(l[2], l[3]); c.stroke(); });
  c.strokeRect(L, T, ww, wh);
  c.strokeStyle = "rgba(140,132,189,.55)"; c.lineWidth = 1.2;
  for(let k = 1; k <= 5; k++){ const f = Math.pow(k/6, 1.7), y = B + (H - B)*f, xl = L - L*f, xr = R + (W - R)*f; c.beginPath(); c.moveTo(xl, y); c.lineTo(xr, y); c.stroke(); }
  for(let k = 1; k <= 5; k++){ const f = Math.pow(k/6, 1.7), y = T - T*f; c.beginPath(); c.moveTo(L - L*f, y); c.lineTo(R + (W-R)*f, y); c.stroke(); }
  c.setLineDash([4, 5]); c.strokeStyle = "rgba(255,211,107,.55)"; c.lineWidth = 1.2;
  for(let i = 0; i < 12; i++){ const a = i*TAU/12; c.beginPath(); c.moveTo(vx, vy); c.lineTo(vx + Math.cos(a)*W, vy + Math.sin(a)*W); c.stroke(); }
  c.setLineDash([]);
  glow(c, W, H, vx, vy, 40, "#FFD36B", .9); c.fillStyle = "#FFD36B"; c.beginPath(); c.arc(vx, vy, 7, 0, TAU); c.fill();
  c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.arc(vx, vy, 12, 0, TAU); c.stroke();
  c.fillStyle = "#FFE9A8"; c.font = "700 13px 'Zen Maru Gothic', sans-serif"; c.fillText("消失点", Math.min(W-52, vx + 16), Math.max(16, vy - 14));
}

/* ================= 光のラボ ================= */
function renderLightLab(){
  app.innerHTML = `<div class="bar"><button class="link" data-go="home">← 展示室にもどる</button></div>
  <h2 class="sec" style="margin-top:6px">光のラボ<small>光をうごかして、見え方を調べる</small></h2>
  <section class="labcard">
    <p>球の上の金色の光を、ドラッグして動かそう。光の向きが変わると、いちばん明るい所と、かべにできるかげの場所が変わる。レンブラントやラ・トゥールは、この光とかげを使って、見せたいものを浮かび上がらせた。</p>
    <canvas id="lcvs" width="340" height="340" tabindex="0" role="img" aria-label="球に光を当てた絵。金色の光をドラッグして動かせる"></canvas>
    <div class="note" id="lnote"><b>光は今</b>右上から</div>
    <button class="btn primary" style="justify-self:start" data-act="start" data-m="light">光の向きチャレンジ（6問）</button>
  </section>
  <h2 class="sec">考えよう<small>教科書 P.113 の問い</small></h2>
  <section class="labcard">
    <p><b>「フォリー・ベルジェールのバー」の絵の中の光は、どこから照らされているのだろうか。</b></p>
    <p class="muted">まず自分で考えて、友だちとも話してみよう。</p>
    <button class="btn small" style="justify-self:start" data-act="think-toggle" aria-expanded="${!!view.think}">${view.think ? "ひとつの考え方をとじる" : "ひとつの考え方を見る"}</button>
    ${view.think ? `<div class="note"><b>ひとつの考え方</b>天井のシャンデリアなど、店内の灯りが主な光と考えられる。女性の顔や胸もとが明るく、ガラスやびんが輝いている。ただし答えはひとつではない。鏡に映った灯りの位置も手がかりになる。</div>` : ""}
  </section>`;
  const cv = document.getElementById("lcvs"); let th = Math.PI/4;
  const f = () => { drawLight(cv, th, {hi:1, sh:1, marker:true}); const i = Math.round(((th % TAU) + TAU) % TAU / (Math.PI/4)) % 8; document.getElementById("lnote").innerHTML = `<b>光は今</b>${DIRS[i]}から`; };
  const set = e => { const b = cv.getBoundingClientRect(), x = (e.clientX - b.left)/b.width - .5, y = (e.clientY - b.top)/b.height - .5 - .02; th = Math.atan2(-y, x); f(); };
  let down = false; cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); set(e); }; cv.onpointermove = e => { if(down) set(e); }; cv.onpointerup = () => { down = false; };
  cv.onkeydown = e => { if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); th += Math.PI/16; f(); } if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); th -= Math.PI/16; f(); } };
  f();
}

/* ================= 紙ふぶき ================= */
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("fx"); cv.hidden = false;
  const c = cv.getContext("2d"), Wd = cv.width = innerWidth, Hd = cv.height = innerHeight;
  const cols = ["#F0B33A","#FFE3A6","#7C90B6","#B23A2E","#4CC995"];
  const ps = range(110).map(() => ({x:Wd/2 + (Math.random()-.5)*80, y:Hd*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+4, c:pick(cols), a:Math.random()*6}));
  const t0 = performance.now();
  (function f(t){ c.clearRect(0,0,Wd,Hd); ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; c.save(); c.translate(p.x,p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); c.restore(); }); if(t - t0 < 2200) requestAnimationFrame(f); else { c.clearRect(0,0,Wd,Hd); cv.hidden = true; } })(t0);
}

/* ================= イベント ================= */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ SFX.tap(); if(view.name === "quiz") Q = null; go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act;
  if(act === "close-modal"){ if(e.target === a || a.id === "mclose") closeModal(); return; }
  if(act === "room"){
    const id = a.dataset.id; SFX.tap();
    if(id === "lab") go("lab", {tab:"sfu"}); else if(id === "light") go("light"); else startSession(id);
    return;
  }
  if(act === "start"){ startSession(a.dataset.m); return; }
  if(act === "again"){ startSession(a.dataset.m); return; }
  if(act === "review"){ startSession("review"); return; }
  if(act === "tab"){ SFX.tap(); view.tab = a.dataset.id; renderLab(); return; }
  if(act === "think-toggle"){ view.think = !view.think; renderLightLab(); return; }
  if(act === "work"){ openWork(a.dataset.id); return; }
  if(act === "gal-tab"){ SFX.tap(); view.f = a.dataset.id; renderGallery(); return; }
  if(act === "gal-hide"){ view.hide = !view.hide; view.rev = {}; renderGallery(); return; }
  if(act === "gwork"){ const id = a.dataset.id; if(view.hide && !(view.rev || {})[id]){ (view.rev = view.rev || {})[id] = true; const sc = window.scrollY; renderGallery(); window.scrollTo(0, sc); } else openWork(id); return; }
  if(act === "fc-start"){ SFX.tap(); startCards(); return; }
  if(act === "fc-flip"){ view.flip = true; SFX.tap(); renderCards(); return; }
  if(act === "fc-again"){ view.q.push(view.q.shift()); view.flip = false; renderCards(); return; }
  if(act === "fc-know"){
    view.q.shift(); view.known++; view.flip = false; S.xp += 3; save(); SFX.ok();
    if(!view.q.length){ S.xp += 20; save(); SFX.win(); confetti(); }
    renderCards(); window.scrollTo(0, 0); return;
  }
  if(act === "share-toggle"){ view.share = !view.share; view.copied = false; renderHome(); return; }
  if(act === "settings-toggle"){ view.settings = !view.settings; view.resetArm = false; renderHome(); return; }
  if(act === "t-sound"){ S.sound = !S.sound; save(); renderHome(); SFX.tap(); return; }
  if(act === "reset"){ if(!view.resetArm){ view.resetArm = true; renderHome(); return; } S = defaults(); save(); view = {name:"home"}; render(); return; }
  if(act === "copy"){ const inp = document.getElementById("share-url"); try{ navigator.clipboard.writeText(APP_URL).then(() => { view.copied = true; a.textContent = "コピーしました"; }, () => inp.select()); }catch(err){ inp.select(); } return; }
  if(act === "webshare"){ try{ navigator.share({title:"光とかげの美術館", text:"中1美術の名画を、絵と題名で楽しく覚えよう。", url:APP_URL}).catch(() => {}); }catch(err){} return; }
  if(act === "install"){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderHome(); }); } return; }
  if(!Q) return;
  if(act === "quit"){
    if(!Q.quitArm){ Q.quitArm = true; a.textContent = "やめる？"; setTimeout(() => { if(Q && Q.quitArm){ Q.quitArm = false; const x = document.querySelector(".x"); if(x) x.textContent = "✕"; } }, 2500); return; }
    const m = Q.mode; Q = null; go(m.startsWith("lab:") ? "lab" : m === "light" ? "light" : "home", m.startsWith("lab:") ? {tab:m.slice(4)} : {}); return;
  }
  if(act === "m-flip"){ flipCard(+a.dataset.i); return; }
  if(act === "ans"){ answerChoice(+a.dataset.k); return; }
  if(act === "hint-open"){ const q = cur(); if(q.used < 3){ q.used++; SFX.tap(); const sc = window.scrollY; renderQuiz(); window.scrollTo(0, sc); } return; }
  if(act === "next"){ next(); return; }
  if(act === "l-ans"){ answerLight(a.dataset.d); return; }
  if(act === "o-in" || act === "o-out" || act === "o-clear"){
    const q = cur(); if(Q.answered) return; const id = a.dataset.id;
    if(act === "o-in" && !q.placed.includes(id)){ q.placed.push(id); SFX.tap(); }
    if(act === "o-out") q.placed = q.placed.filter(x => x !== id);
    if(act === "o-clear") q.placed = [];
    const sc = window.scrollY; renderQuiz(); window.scrollTo(0, sc); return;
  }
  if(act === "o-check"){ answerOrder(); return; }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && modalRoot.firstChild){ closeModal(); return; }
  if(view.name !== "quiz" || !Q || Q.answered || e.target.tagName === "INPUT") return;
  const q = cur();
  if((q.kind === "choice" || q.kind === "hint") && /^[1-4]$/.test(e.key) && q.options[+e.key-1] != null) answerChoice(+e.key-1);
});

render();
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
